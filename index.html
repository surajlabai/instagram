<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#02030a">
  <title>English Mastery · Learn & Play</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #02030a; color: #fff; font-size: 16px; }

    #three-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(2,3,10,0.8) 100%); }

    #app { position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #app::-webkit-scrollbar { width: 6px; }
    #app::-webkit-scrollbar-thumb { background: #6b9eff; border-radius: 10px; }

    /* ============ HOME ============ */
    .home { padding: 30px 20px 60px; max-width: 1200px; margin: 0 auto; min-height: 100vh; }
    .home-header { text-align: center; padding: 30px 0 30px; }
    .home-logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 84px; height: 84px; border-radius: 26px;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      box-shadow: 0 20px 50px rgba(139,92,246,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
      font-size: 2.4rem; margin-bottom: 18px;
      animation: floatLogo 3s ease-in-out infinite;
    }
    @keyframes floatLogo { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    .home-title {
      font-size: 2rem; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, #a5d8ff, #b197fc, #fbbf24);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .home-sub { font-size: 0.95rem; color: #8b97b8; max-width: 600px; margin: 0 auto; line-height: 1.6; }

    .stats-row { display: flex; justify-content: center; gap: 10px; margin: 20px 0 30px; flex-wrap: wrap; }
    .stat-box {
      background: rgba(8, 12, 24, 0.7); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 12px 18px; text-align: center; min-width: 90px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .stat-value { font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, #a5d8ff, #b197fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { font-size: 0.62rem; color: #90b8ff; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-top: 3px; }

    /* Modules grid */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card-item {
      position: relative; overflow: hidden;
      background: rgba(8, 12, 24, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px; padding: 26px 22px;
      cursor: pointer; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .card-item:hover { transform: translateY(-8px); border-color: rgba(107,158,255,0.4); box-shadow: 0 30px 80px rgba(59,130,246,0.3); }
    .card-item::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, var(--glow), transparent 60%);
      opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
    }
    .card-item:hover::before { opacity: 1; }
    .card-item.c1 { --glow: rgba(107,158,255,0.15); }
    .card-item.c2 { --glow: rgba(168,85,247,0.15); }
    .card-item.c3 { --glow: rgba(6,182,212,0.15); }
    .card-item.c4 { --glow: rgba(236,72,153,0.15); }
    .card-item.c5 { --glow: rgba(251,191,36,0.15); }
    .card-item.m1 { --glow: rgba(107,158,255,0.15); }
    .card-item.m2 { --glow: rgba(168,85,247,0.15); }
    .card-item.m3 { --glow: rgba(6,182,212,0.15); }
    .card-item.m4 { --glow: rgba(236,72,153,0.15); }
    .card-item.m5 { --glow: rgba(251,191,36,0.15); }

    .card-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 30px;
      font-size: 0.65rem; font-weight: 900; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .c1 .card-badge, .m1 .card-badge { background: rgba(107,158,255,0.15); color: #a5d8ff; }
    .c2 .card-badge, .m2 .card-badge { background: rgba(168,85,247,0.15); color: #d8b4fe; }
    .c3 .card-badge, .m3 .card-badge { background: rgba(6,182,212,0.15); color: #67e8f9; }
    .c4 .card-badge, .m4 .card-badge { background: rgba(236,72,153,0.15); color: #f9a8d4; }
    .c5 .card-badge, .m5 .card-badge { background: rgba(251,191,36,0.15); color: #fcd34d; }

    .card-icon { font-size: 2.2rem; margin-bottom: 12px; display: block; }
    .card-title { font-size: 1.15rem; font-weight: 900; color: #fff; margin-bottom: 6px; }
    .card-desc { font-size: 0.82rem; color: #9aa4c0; line-height: 1.55; margin-bottom: 16px; min-height: 50px; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
    .card-meta-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: #7a8ba8; font-weight: 700; }
    .card-arrow { font-size: 1rem; color: #6b9eff; transition: transform 0.3s ease; }
    .card-item:hover .card-arrow { transform: translateX(4px); }
    .card-item.done { border-color: rgba(34,197,94,0.4); }
    .card-item.done::after {
      content: '✓'; position: absolute; top: 16px; right: 16px;
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 900; color: #fff;
    }

    /* ============ SUB PAGE ============ */
    .sub-page { display: none; padding: 20px; max-width: 900px; margin: 0 auto; min-height: 100vh; }
    .sub-page.active { display: block; }

    .sub-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(2,3,10,0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 16px 20px; margin: -20px -20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 14px;
    }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #fff; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
      font-size: 1.2rem;
    }
    .back-btn:hover { background: rgba(59,130,246,0.2); }
    .back-btn:active { transform: scale(0.95); }
    .sub-title { flex: 1; min-width: 0; }
    .sub-title-main { font-size: 1.1rem; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub-title-sub { font-size: 0.72rem; color: #90b8ff; font-weight: 700; margin-top: 2px; }

    /* LETTERS GRID */
    .letters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding-bottom: 40px; }
    .letter-card {
      background: rgba(8, 12, 24, 0.75);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 16px 12px; text-align: center;
      cursor: pointer; transition: all 0.25s ease;
      position: relative; overflow: hidden;
    }
    .letter-card:hover { transform: translateY(-4px); border-color: rgba(107,158,255,0.5); box-shadow: 0 15px 40px rgba(59,130,246,0.3); }
    .letter-card.done { border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.08); }
    .letter-big {
      font-size: 2.2rem; font-weight: 900;
      background: linear-gradient(135deg, #a5d8ff, #b197fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1; margin-bottom: 4px;
    }
    .letter-small { font-size: 1.4rem; color: #90b8ff; font-weight: 900; margin-bottom: 6px; }
    .letter-sound { font-size: 0.75rem; color: #86efac; font-weight: 800; }

    /* SOUNDS categories */
    .sound-category {
      background: rgba(8, 12, 24, 0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px; padding: 22px 20px;
      margin-bottom: 16px; cursor: pointer;
      transition: all 0.3s ease;
      display: flex; align-items: center; gap: 16px;
    }
    .sound-category:hover { border-color: rgba(107,158,255,0.4); transform: translateX(4px); }
    .sound-cat-icon { font-size: 2rem; width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, rgba(107,158,255,0.15), rgba(168,85,247,0.15)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sound-cat-info { flex: 1; }
    .sound-cat-title { font-size: 1.05rem; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .sound-cat-desc { font-size: 0.78rem; color: #90b8ff; font-weight: 600; }
    .sound-cat-arrow { color: #6b9eff; font-size: 1.2rem; }

    /* VERBS letters row */
    .verbs-letters { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0 20px; justify-content: center; }
    .verb-letter-btn {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(8, 12, 24, 0.75);
      border: 2px solid rgba(255,255,255,0.08);
      color: #fff; font-size: 1.1rem; font-weight: 900;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .verb-letter-btn:hover { border-color: rgba(107,158,255,0.5); transform: translateY(-3px); }
    .verb-letter-btn.active { background: linear-gradient(135deg, #3b82f6, #6d5dfc); border-color: transparent; box-shadow: 0 6px 20px rgba(59,130,246,0.5); }

    .verbs-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px; }
    .verb-card {
      background: rgba(8, 12, 24, 0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 18px;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 14px;
    }
    .verb-card:hover { border-color: rgba(107,158,255,0.4); background: rgba(107,158,255,0.06); }
    .verb-card-num { width: 32px; height: 32px; border-radius: 50%; background: rgba(107,158,255,0.15); color: #a5d8ff; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 900; flex-shrink: 0; }
    .verb-card-info { flex: 1; }
    .verb-card-v1 { font-size: 1rem; font-weight: 900; color: #fff; margin-bottom: 2px; }
    .verb-card-hi { font-size: 0.75rem; color: #90b8ff; font-weight: 700; }
    .verb-card-arrow { color: #6b9eff; }

    /* Verb detail */
    .verb-detail {
      background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(168,85,247,0.1));
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 22px; padding: 26px 22px; margin-bottom: 20px;
      text-align: center;
    }
    .verb-detail-v1 { font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 6px; letter-spacing: 1px; }
    .verb-detail-hi { font-size: 0.95rem; color: #86efac; font-weight: 800; margin-bottom: 20px; }
    .verb-forms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .verb-form { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 14px 10px; border: 1px solid rgba(255,255,255,0.06); }
    .verb-form-label { font-size: 0.7rem; color: #90b8ff; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .verb-form-value { font-size: 1.05rem; font-weight: 900; color: #fff; }

    /* Be verb / Modern verb cards */
    .verbs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding-bottom: 40px; }
    .be-verb-card {
      background: rgba(8, 12, 24, 0.75);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 18px 16px;
      cursor: pointer; transition: all 0.25s ease;
      text-align: center;
    }
    .be-verb-card:hover { transform: translateY(-4px); border-color: rgba(107,158,255,0.5); box-shadow: 0 15px 40px rgba(59,130,246,0.3); }
    .be-verb-word { font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .be-verb-hi { font-size: 0.85rem; color: #86efac; font-weight: 800; margin-bottom: 8px; }
    .be-verb-usage { font-size: 0.72rem; color: #90b8ff; font-weight: 700; line-height: 1.4; }

    /* Sentences list */
    .sentences-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px; }
    .sentence-row {
      background: rgba(8, 12, 24, 0.7);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 14px 18px;
      display: flex; align-items: flex-start; gap: 14px;
      transition: all 0.2s ease;
    }
    .sentence-row:hover { border-color: rgba(107,158,255,0.3); background: rgba(107,158,255,0.04); }
    .sentence-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      color: #fff; font-size: 0.75rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sentence-info { flex: 1; }
    .sentence-en { font-size: 0.98rem; color: #fff; font-weight: 800; margin-bottom: 4px; line-height: 1.4; }
    .sentence-hi { font-size: 0.82rem; color: #90b8ff; font-weight: 700; }

    /* Practice button */
    .practice-btn {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 16px 40px; border-radius: 60px;
      background: linear-gradient(135deg, #3b82f6, #6d5dfc);
      border: none; color: #fff; font-size: 1rem; font-weight: 900;
      cursor: pointer; box-shadow: 0 12px 40px rgba(59,130,246,0.6);
      z-index: 30; display: flex; align-items: center; gap: 10px;
      letter-spacing: 0.5px;
    }
    .practice-btn:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 18px 50px rgba(59,130,246,0.8); }

    /* ============ GAME PAGE ============ */
    .game-page { display: none; padding: 20px; max-width: 700px; margin: 0 auto; min-height: 100vh; }
    .game-page.active { display: block; }

    .game-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .game-progress-bar { flex: 1; height: 8px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; }
    .game-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #a855f7); transition: width 0.3s ease; border-radius: 10px; }
    .game-progress-text { font-size: 0.8rem; color: #90b8ff; font-weight: 800; flex-shrink: 0; }

    .game-question-card {
      background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(168,85,247,0.1));
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 24px; padding: 30px 24px; margin-bottom: 20px;
      text-align: center; position: relative; overflow: hidden;
    }
    .game-q-emoji { font-size: 3.5rem; margin-bottom: 10px; display: block; animation: floatEmoji 3s ease-in-out infinite; }
    @keyframes floatEmoji { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .game-q-text { font-size: 1.2rem; font-weight: 900; color: #fff; line-height: 1.5; margin-bottom: 6px; }
    .game-q-hint { font-size: 0.85rem; color: #90b8ff; font-weight: 700; }
    .game-q-big-letter { font-size: 4rem; font-weight: 900; background: linear-gradient(135deg, #a5d8ff, #b197fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }

    .game-options { display: flex; flex-direction: column; gap: 12px; }
    .game-option {
      padding: 16px 20px; border-radius: 16px;
      background: rgba(8, 12, 24, 0.75);
      border: 2px solid rgba(255,255,255,0.08);
      color: #fff; font-size: 1rem; font-weight: 800;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; gap: 14px;
      text-align: left;
    }
    .game-option:hover { border-color: rgba(107,158,255,0.5); background: rgba(107,158,255,0.08); transform: translateX(6px); }
    .game-option.correct { border-color: #22c55e; background: rgba(34,197,94,0.15); color: #86efac; }
    .game-option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.15); color: #fca5a5; animation: shake 0.4s ease; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .game-option-letter {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(107,158,255,0.15); color: #a5d8ff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; font-weight: 900; flex-shrink: 0;
    }
    .game-option.correct .game-option-letter { background: rgba(34,197,94,0.3); color: #86efac; }
    .game-option.wrong .game-option-letter { background: rgba(239,68,68,0.3); color: #fca5a5; }

    .game-feedback { min-height: 26px; text-align: center; font-size: 0.95rem; font-weight: 900; margin-top: 16px; }
    .game-next-btn {
      display: none; width: 100%; padding: 16px; margin-top: 16px;
      background: linear-gradient(135deg, #3b82f6, #6d5dfc);
      border: none; color: #fff; font-size: 1rem; font-weight: 900;
      border-radius: 16px; cursor: pointer;
      box-shadow: 0 8px 24px rgba(59,130,246,0.4);
    }
    .game-next-btn:hover { transform: translateY(-2px); }
    .game-next-btn.show { display: block; }

    .confetti-pop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; z-index: 999; animation: popFade 1.3s ease forwards; pointer-events: none; }
    @keyframes popFade { 0% { opacity: 0; transform: translate(-50%,-30%) scale(0.4); } 30% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); } 70% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-70%) scale(0.8); } }

    .result-card {
      background: linear-gradient(135deg, rgba(15,20,35,0.98), rgba(25,15,40,0.98));
      border: 1px solid rgba(139,92,246,0.4);
      border-radius: 28px; padding: 40px 30px; text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 100px rgba(139,92,246,0.3);
    }
    .result-emoji { font-size: 4.5rem; margin-bottom: 16px; display: block; animation: floatEmoji 2.5s ease-in-out infinite; }
    .result-title { font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, #a5d8ff, #b197fc, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .result-sub { font-size: 0.95rem; color: #9aa4c0; margin-bottom: 24px; }
    .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    .result-stat { background: rgba(0,0,0,0.4); border-radius: 18px; padding: 18px 12px; border: 1px solid rgba(139,92,246,0.2); }
    .result-stat-value { font-size: 1.8rem; font-weight: 900; background: linear-gradient(135deg, #fff, #a5d8ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .result-stat-label { font-size: 0.7rem; color: #90b8ff; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-top: 6px; }

    .btn-primary {
      width: 100%; padding: 16px; border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #6d5dfc);
      border: none; color: #fff; font-size: 1rem; font-weight: 900;
      cursor: pointer; box-shadow: 0 8px 24px rgba(59,130,246,0.4);
      transition: all 0.2s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: #4a5568; }
    .empty-icon { font-size: 3rem; margin-bottom: 14px; opacity: 0.5; }
    .empty-text { font-size: 0.9rem; line-height: 1.6; }

    /* Mobile */
    @media (max-width: 640px) {
      .home { padding: 20px 16px 60px; }
      .home-title { font-size: 1.5rem; }
      .home-logo { width: 68px; height: 68px; font-size: 2rem; }
      .letter-big { font-size: 1.8rem; }
      .letter-small { font-size: 1.1rem; }
      .game-q-big-letter { font-size: 3rem; }
      .verb-form-value { font-size: 0.9rem; }
      .result-title { font-size: 1.5rem; }
      .letters-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>
<canvas id="three-canvas"></canvas>
<div class="vignette"></div>

<div id="app">
  <!-- HOME -->
  <div class="home" id="home-page">
    <div class="home-header">

<script>
// ============================================================
// STATE
// ============================================================
let state = {
  currentModule: null,
  currentCard: null,
  currentSubSection: null,
  currentSubData: null,
  gameQuestions: [],
  gameIdx: 0,
  gameScore: 0,
  gameCorrect: 0,
  gameWrong: 0,
  doneCards: JSON.parse(localStorage.getItem('em_done') || '[]'),
  totalScore: parseInt(localStorage.getItem('em_score') || '0'),
  currentView: 'home'
};

// ============================================================
// COLLECT ALL MODULES
// ============================================================
function getAllModules() {
  const modules = [];
  if (typeof MODULE1 !== 'undefined') modules.push(MODULE1);
  if (typeof MODULE2 !== 'undefined') modules.push(MODULE2);
  if (typeof MODULE3 !== 'undefined') modules.push(MODULE3);
  if (typeof MODULE4 !== 'undefined') modules.push(MODULE4);
  // Module 5 (WordMeaning game) — embedded below
  if (typeof MODULE5 !== 'undefined') modules.push(MODULE5);
  return modules;
}

// ============================================================
// HOME RENDER
// ============================================================
function renderHome() {
  const modules = getAllModules();
  if (modules.length === 0) {
    document.getElementById('cards-grid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">📚</div>
        <div class="empty-text">
          No modules loaded.<br>
          Make sure <b>module1.js</b>, <b>module2.js</b>, etc. are in the same folder.
        </div>
      </div>`;
    return;
  }

  document.getElementById('home-title').textContent = 'English Mastery';
  document.getElementById('home-sub').textContent = '5 Modules · Learn English · Play & Practice';

  const grid = document.getElementById('cards-grid');
  grid.innerHTML = modules.map((m, i) => {
    const isGame = m.isGame === true;
    const isDone = state.doneCards.includes(m.id);
    return `
      <div class="card-item m${i+1} ${isDone ? 'done' : ''}" onclick="openModule('${m.id}')">
        <div class="card-badge">${m.badge || 'Module ' + (i+1)}</div>
        <span class="card-icon">${m.icon || '📚'}</span>
        <div class="card-title">${m.title}</div>
        <div class="card-desc">${m.desc}</div>
        <div class="card-meta">
          <div class="card-meta-item">
            ${isGame ? '🎮 Interactive Game' : `📖 ${(m.cards || []).length} Cards`}
          </div>
          <div class="card-arrow">→</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('stat-cards').textContent = modules.length;
  document.getElementById('stat-lessons').textContent = state.doneCards.length;
  document.getElementById('stat-score').textContent = state.totalScore;
}

// ============================================================
// NAVIGATION
// ============================================================
function goHome() {
  document.getElementById('sub-page').classList.remove('active');
  document.getElementById('game-page').classList.remove('active');
  document.getElementById('home-page').style.display = 'block';
  document.getElementById('app').scrollTop = 0;
  state.currentModule = null;
  state.currentCard = null;
  state.currentView = 'home';
  renderHome();
}

function goBack() {
  if (state.currentView === 'sub-sub') {
    // Go back to module's card list
    state.currentView = 'module';
    openModule(state.currentModule.id, true);
  } else if (state.currentView === 'module') {
    goHome();
  } else {
    goHome();
  }
}

function openModule(moduleId, keepView) {
  const modules = getAllModules();
  const m = modules.find(x => x.id === moduleId);
  if (!m) return;

  state.currentModule = m;
  document.getElementById('home-page').style.display = 'none';
  document.getElementById('game-page').classList.remove('active');
  document.getElementById('sub-page').classList.add('active');
  document.getElementById('app').scrollTop = 0;

  // If Module 5 (game) → open WordMeaning game directly
  if (m.isGame) {
    startWordMeaningGame();
    return;
  }

  state.currentView = 'module';
  document.getElementById('sub-title').textContent = m.icon + ' ' + m.title;
  document.getElementById('sub-sub').textContent = m.badge + ' · ' + m.sub;

  const content = document.getElementById('sub-content');
  content.innerHTML = (m.cards || []).map((c, i) => {
    const isDone = state.doneCards.includes(m.id + '_' + c.id);
    return `
      <div class="card-item m${i+1} ${isDone ? 'done' : ''}" style="margin-bottom:12px" onclick="openCard('${c.id}')">
        <div class="card-badge">Card ${i+1}</div>
        <span class="card-icon">${c.icon}</span>
        <div class="card-title">${c.title}</div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-meta">
          <div class="card-meta-item">🎯 Click to open</div>
          <div class="card-arrow">→</div>
        </div>
      </div>
    `;
  }).join('');
}

// ============================================================
// CARD OPEN (Letters / Sounds / Verbs / Be Verbs / Modern Verbs)
// ============================================================
function openCard(cardId) {
  const m = state.currentModule;
  const card = m.cards.find(c => c.id === cardId);
  if (!card) return;

  state.currentCard = card;
  state.currentView = 'sub-sub';
  document.getElementById('app').scrollTop = 0;

  document.getElementById('sub-title').textContent = card.icon + ' ' + card.title;
  document.getElementById('sub-sub').textContent = m.badge + ' · ' + m.title;

  const content = document.getElementById('sub-content');

  // Route to correct renderer based on type
  switch (card.type) {
    case 'letters':    content.innerHTML = renderLetters(card); break;
    case 'sounds':     content.innerHTML = renderSounds(card); break;
    case 'verbs':      content.innerHTML = renderVerbsCard(card); break;
    case 'beverbs':    content.innerHTML = renderBeVerbs(card); break;
    case 'modernverbs':content.innerHTML = renderModernVerbs(card); break;
    default:           content.innerHTML = '<div class="empty-state"><div class="empty-text">Coming soon...</div></div>';
  }
}

// ============================================================
function openGamePage(title, sub) {
  document.getElementById('sub-page').classList.remove('active');
  document.getElementById('game-page').classList.add('active');
  document.getElementById('game-title').textContent = title;
  document.getElementById('game-sub').textContent = sub;
  document.getElementById('app').scrollTop = 0;

function closeGame() {
  state.gameQuestions = [];
  state.gameIdx = 0;
  state.gameScore = 0;
  state.gameCorrect = 0;
  state.gameWrong = 0;
  if (state.currentView === 'sub-sub') {
    openCard(state.currentCard.id);
  } else {
    goHome();
  }
}

function buildQuestions(type, payload) {
  // Returns array of { question, options, answer, hint, emoji }
  const questions = [];

  if (type === 'letter') {
    const letters = MODULE1.cards.find(c => c.id === 'letters').letters;
    letters.forEach((l) => {
      // Question: "A का sound क्या है?"
      const correct = l.sound;
      const others = letters.filter(x => x.sound !== correct).map(x => x.sound);
      const options = shuffle([correct, ...others.slice(0, 3)]);
      questions.push({
        emoji: l.emoji || '🔤',
        question: `"${l.capital}${l.small}" का sound क्या है?`,
        hint: `Example: ${l.word}`,
        options: options,
        answer: correct
      });
    });
  }

  if (type === 'sound') {
    const card = state.currentCard;
    const catIdx = payload.catIdx || 0;
    const cat = card.categories[catIdx];
    cat.items.forEach((item) => {
      const correct = item.sound;
      const others = cat.items.filter(x => x.sound !== correct).map(x => x.sound);
      const options = shuffle([correct, ...others.slice(0, 3)]);
      questions.push({
        emoji: item.emoji || '🔊',
        question: `"${item.symbol}" का sound क्या है?`,
        hint: `Example: ${item.word}`,
        options: options,
        answer: correct
      });
    });
  }

  if (type === 'verb') {
    const card = state.currentCard;
    const groupIdx = payload.groupIdx || 0;
    const verbs = card.groups[groupIdx].verbs;

    verbs.forEach((v) => {
      // Question 1: v2?
      const othersV2 = verbs.filter(x => x.v2 !== v.v2).map(x => x.v2);
      const optsV2 = shuffle([v.v2, ...othersV2.slice(0, 3)]);
      questions.push({
        emoji: '📝',
        question: `"${v.v1}" (${v.hi}) का V2 (Past) क्या है?`,
        hint: `V1: ${v.v1} · V3: ${v.v3}`,
        options: optsV2,
        answer: v.v2
      });
    });
  }

  if (type === 'beverb') {
    const card = state.currentCard;
    const verbIdx = payload.verbIdx;
    const verbs = card.verbs;
    const targetVerb = verbs[verbIdx];

    // Question 1: Which form to use?
    targetVerb.sentences.forEach((s) => {
      // Replace the verb in sentence with blank
      const blanked = s.en.replace(new RegExp('\\b' + targetVerb.word + '\\b', 'i'), '___');
      const correct = targetVerb.word;
      const others = verbs.filter(x => x.word !== correct).map(x => x.word);
      const options = shuffle([correct, ...others.slice(0, 3)]);
      questions.push({
        emoji: '🔗',
        question: blanked,
        hint: s.hi,
        options: options,
        answer: correct
      });
    });
  }

  if (type === 'modernverb') {
    const card = state.currentCard;
    const verbIdx = payload.verbIdx;
    const verbs = card.verbs;
    const targetVerb = verbs[verbIdx];

    targetVerb.sentences.forEach((s) => {
      const blanked = s.en.replace(new RegExp('\\b' + targetVerb.word + '\\b', 'i'), '___');
      const correct = targetVerb.word;
      const others = verbs.filter(x => x.word !== correct).map(x => x.word);
      const options = shuffle([correct, ...others.slice(0, 3)]);
      questions.push({
        emoji: '🎭',
        question: blanked,
        hint: s.hi,
        options: options,
        answer: correct
      });
    });
  }

  return questions;
}

// ============================================================
// START GAMES (called from renderers)
// ============================================================
function startLetterGame(startIdx) {
  const questions = buildQuestions('letter');
  startGameSession(questions, '🔤 Letters', 'A-Z Sounds & Words');
}

function startSoundGame(startIdx, catIdx) {
  const questions = buildQuestions('sound', { catIdx: catIdx || 0 });
  const card = state.currentCard;
  const cat = card.categories[catIdx || 0];
  startGameSession(questions, cat.icon + ' ' + cat.title, 'Sound Practice');
}

function startVerbGame(groupIdx) {
  const questions = buildQuestions('verb', { groupIdx: groupIdx || 0 });
  startGameSession(questions, '⚡ Verbs', 'V1, V2, V3 Practice');
}

function startBeVerbGame(verbIdx) {
  const questions = buildQuestions('beverb', { verbIdx: verbIdx || 0 });
  const v = state.currentCard.verbs[verbIdx || 0];
  startGameSession(questions, '🔗 ' + v.word, 'Be Verb Practice');
}

function startModernVerbGame(verbIdx) {
  const questions = buildQuestions('modernverb', { verbIdx: verbIdx || 0 });
  const v = state.currentCard.verbs[verbIdx || 0];
  startGameSession(questions, '🎭 ' + v.word, 'Modern Verb Practice');
}

function startGameSession(questions, title, sub) {
  if (questions.length === 0) {
    alert('No questions available for this section.');
    return;
  }
  state.gameQuestions = questions;
  state.gameIdx = 0;
  state.gameScore = 0;
  state.gameCorrect = 0;
  state.gameWrong = 0;

  openGamePage(title, sub);
  renderGameQuestion();
}

// ============================================================
// RENDER GAME QUESTION
// ============================================================
function renderGameQuestion() {
  const q = state.gameQuestions[state.gameIdx];
  if (!q) return;

  const total = state.gameQuestions.length;
  document.getElementById('game-progress-text').textContent = `${state.gameIdx + 1} / ${total}`;
  document.getElementById('game-progress-fill').style.width = `${((state.gameIdx + 1) / total) * 100}%`;

  const content = document.getElementById('game-content');
  content.innerHTML = `
    <div class="game-question-card">
      ${q.emoji ? `<span class="game-q-emoji">${q.emoji}</span>` : ''}
      <div class="game-q-text">${escapeHtml(q.question)}</div>
      ${q.hint ? `<div class="game-q-hint">${escapeHtml(q.hint)}</div>` : ''}
    </div>
    <div class="game-options" id="game-options">
      ${q.options.map((opt, i) => `
        <div class="game-option" data-idx="${i}" onclick="selectGameOption(${i})">
          <div class="game-option-letter">${String.fromCharCode(65 + i)}</div>
          <div>${escapeHtml(opt)}</div>
        </div>
      `).join('')}
    </div>
    <div class="game-feedback" id="game-feedback"></div>
    <button class="game-next-btn" id="game-next-btn" onclick="nextGameQuestion()">
      ${state.gameIdx === total - 1 ? '🏁 See Result' : '➡️ Next'}
    </button>
  `;
}

function selectGameOption(idx) {
  const q = state.gameQuestions[state.gameIdx];
  const options = document.querySelectorAll('.game-option');
  options.forEach(o => o.style.pointerEvents = 'none');

  const isCorrect = q.options[idx] === q.answer;
  const fb = document.getElementById('game-feedback');

  if (isCorrect) {
    options[idx].classList.add('correct');
    fb.style.color = '#86efac';
    fb.textContent = '✅ Correct!';
    state.gameScore += 10;
    state.gameCorrect++;
    showConfetti();
  } else {
    options[idx].classList.add('wrong');
    const correctIdx = q.options.indexOf(q.answer);
    if (correctIdx >= 0) options[correctIdx].classList.add('correct');
    fb.style.color = '#fca5a5';
    fb.textContent = `❌ Correct answer: ${q.answer}`;
    state.gameWrong++;
  }

  document.getElementById('game-next-btn').classList.add('show');
}

function nextGameQuestion() {
  state.gameIdx++;
  if (state.gameIdx >= state.gameQuestions.length) {
    showGameResult();
  } else {
    renderGameQuestion();
  }
}

function showGameResult() {
  const total = state.gameQuestions.length;
  const pct = Math.round((state.gameCorrect / total) * 100);
  let emoji = '🏆', title = 'Excellent!', sub = 'You nailed it!';
  if (pct < 40) { emoji = '🌱'; title = 'Keep Practicing!'; sub = 'Try again to improve'; }
  else if (pct < 70) { emoji = '👍'; title = 'Good Job!'; sub = 'You are getting there'; }
  else if (pct < 90) { emoji = '🔥'; title = 'Great Work!'; sub = 'Above average!'; }
  else { emoji = '👑'; title = 'Legendary!'; sub = 'Perfect score!'; }

  // Save score to localStorage
  state.totalScore += state.gameScore;
  localStorage.setItem('em_score', state.totalScore);

  const cardKey = state.currentModule.id + '_' + state.currentCard.id;
  if (!state.doneCards.includes(cardKey)) {
    state.doneCards.push(cardKey);
    localStorage.setItem('em_done', JSON.stringify(state.doneCards));
  }

  const content = document.getElementById('game-content');
  content.innerHTML = `
    <div class="result-card">
      <span class="result-emoji">${emoji}</span>
      <div class="result-title">${title}</div>
      <div class="result-sub">${sub}</div>
      <div class="result-stats">
        <div class="result-stat">
          <div class="result-stat-value">${state.gameCorrect}/${total}</div>
          <div class="result-stat-label">Correct</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-value">${pct}%</div>
          <div class="result-stat-label">Accuracy</div>
        </div>
      </div>
      <button class="btn-primary" onclick="restartGameSession()" style="margin-bottom:10px">🔁 Try Again</button>
      <button class="btn-primary" onclick="closeGame()" style="background:linear-gradient(135deg,#6b7280,#4b5563)">← Back to Card</button>
    </div>
  `;
  document.getElementById('game-progress-fill').style.width = '100%';
  showConfetti();
}

function restartGameSession() {
  state.gameIdx = 0;
  state.gameScore = 0;
  state.gameCorrect = 0;
  state.gameWrong = 0;
  renderGameQuestion();
}

function wmNewWord() {

  wmState = { ...wmState, entry, bank, idx: 0, solved: false };

function wmClickLetter(letter, el) {
  if (wmState.solved) return;
  const target = wmState.entry.word;

  if (letter === expected) {
    wmState.idx++;

    wmState.score += 10;
    if (wmState.idx === target.length) {
      wmState.solved = true;
      wmState.score += 50;

    wmRender();

  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showConfetti() {
  const pop = document.createElement('div');
  pop.className = 'confetti-pop';
  pop.textContent = '🎉';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1400);
}

(function initThree() {

    const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], wireframe: true, transparent: true, opacity: 0.5, emissive: colors[i % colors.length], emissiveIntensity: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    const angle = (i / 20) * Math.PI * 2;
    const radius = 9 + Math.random() * 4;
    mesh.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 12, Math.sin(angle) * radius - 5);
    mesh.userData = { rotX: (Math.random() - 0.5) * 0.01, rotY: (Math.random() - 0.5) * 0.01, floatSpeed: 0.3 + Math.random() * 0.5, floatAmp: 0.5 + Math.random() * 0.6, baseY: mesh.position.y, offset: Math.random() * Math.PI * 2 };
    scene.add(mesh); floaters.push(mesh);
  }

  const starCount = 500;
  const starPos = new Float32Array(starCount * 3);
  const starCol = new Float32Array(starCount * 3);
  const palette = [new THREE.Color(0x3b82f6), new THREE.Color(0xa855f7), new THREE.Color(0x06b6d4), new THREE.Color(0xffffff)];
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 60;
    starPos[i*3+1] = (Math.random() - 0.5) * 45;
    starPos[i*3+2] = (Math.random() - 0.5) * 45 - 10;
    const c = palette[Math.floor(Math.random() * palette.length)];
    starCol[i*3] = c.r; starCol[i*3+1] = c.g; starCol[i*3+2] = c.b;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(stars);

  let mouseX = 0, mouseY = 0, tX = 0, tY = 0;
  addEventListener('mousemove', (e) => { mouseX = (e.clientX / innerWidth - 0.5) * 2; mouseY = (e.clientY / innerHeight - 0.5) * 2; });
  addEventListener('touchmove', (e) => { if (e.touches[0]) { mouseX = (e.touches[0].clientX / innerWidth - 0.5) * 2; mouseY = (e.touches[0].clientY / innerHeight - 0.5) * 2; } }, { passive: true });

  const clock = new THREE.Clock();
  (function animate() {
    const t = clock.getElapsedTime();
    tX += (mouseX - tX) * 0.05;
    tY += (mouseY - tY) * 0.05;
    camera.position.x = tX * 2;
    camera.position.y = 1 - tY * 2;
    camera.lookAt(0, 0, 0);
    floaters.forEach(f => {
      f.rotation.x += f.userData.rotX;
      f.rotation.y += f.userData.rotY;
      f.position.y = f.userData.baseY + Math.sin(t * f.userData.floatSpeed + f.userData.offset) * f.userData.floatAmp;
    });
    stars.rotation.y = t * 0.02;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  })();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
