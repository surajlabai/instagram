<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>English Mastery · 5 Modules · Learn & Play</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #02030a; color: #fff; font-size: 16px; }

  #three-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(2,3,10,0.8) 100%); }

  #app { position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #app::-webkit-scrollbar { width: 6px; }
  #app::-webkit-scrollbar-thumb { background: #6b9eff; border-radius: 10px; }

  /* ============ HOME ============ */
  .home { padding: 30px 20px 60px; max-width: 1200px; margin: 0 auto; min-height: 100vh; }
  .home-header { text-align: center; padding: 30px 0 40px; }
  .home-logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 84px; height: 84px; border-radius: 26px;
    background: linear-gradient(135deg, #3b82f6, #a855f7);
    box-shadow: 0 20px 50px rgba(139,92,246,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    font-size: 2.4rem; margin-bottom: 18px;
    animation: floatLogo 3s ease-in-out infinite;
  }
  @keyframes floatLogo { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
  .home-title {
    font-size: 2.2rem; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, #a5d8ff, #b197fc, #fbbf24);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 10px;
  }
  .home-sub { font-size: 0.95rem; color: #8b97b8; max-width: 600px; margin: 0 auto; line-height: 1.6; }

  .progression { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 30px auto; flex-wrap: wrap; }
  .prog-step {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 30px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.72rem; font-weight: 700; color: #8b97b8;
  }
  .prog-step .num {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 900;
  }

  .modules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
  .module-card {
    position: relative; overflow: hidden;
    background: rgba(8, 12, 24, 0.75);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px; padding: 26px 22px;
    cursor: pointer; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .module-card:hover { transform: translateY(-8px); border-color: rgba(107,158,255,0.4); box-shadow: 0 30px 80px rgba(59,130,246,0.3); }
  .module-card::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle, var(--glow), transparent 60%);
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  .module-card:hover::before { opacity: 1; }
  .module-card.m1 { --glow: rgba(107,158,255,0.15); }
  .module-card.m2 { --glow: rgba(168,85,247,0.15); }
  .module-card.m3 { --glow: rgba(6,182,212,0.15); }
  .module-card.m4 { --glow: rgba(236,72,153,0.15); }
  .module-card.m5 { --glow: rgba(251,191,36,0.15); }

  .module-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 30px;
    font-size: 0.65rem; font-weight: 900; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 14px;
  }
  .m1 .module-badge { background: rgba(107,158,255,0.15); color: #a5d8ff; }
  .m2 .module-badge { background: rgba(168,85,247,0.15); color: #d8b4fe; }
  .m3 .module-badge { background: rgba(6,182,212,0.15); color: #67e8f9; }
  .m4 .module-badge { background: rgba(236,72,153,0.15); color: #f9a8d4; }
  .m5 .module-badge { background: rgba(251,191,36,0.15); color: #fcd34d; }

  .module-icon { font-size: 2.2rem; margin-bottom: 12px; display: block; }
  .module-title { font-size: 1.15rem; font-weight: 900; color: #fff; margin-bottom: 6px; letter-spacing: -0.3px; }
  .module-sub { font-size: 0.78rem; color: #90b8ff; font-weight: 700; margin-bottom: 10px; }
  .module-desc { font-size: 0.82rem; color: #9aa4c0; line-height: 1.55; margin-bottom: 16px; min-height: 60px; }
  .module-meta { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
  .module-meta-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: #7a8ba8; font-weight: 700; }
  .module-arrow { font-size: 1rem; color: #6b9eff; transition: transform 0.3s ease; }
  .module-card:hover .module-arrow { transform: translateX(4px); }

  /* ============ MODULE DETAIL ============ */
  .module-page { display: none; padding: 20px; max-width: 1000px; margin: 0 auto; min-height: 100vh; }
  .module-page.active { display: block; }

  .module-page-header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(2,3,10,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px; margin: -20px -20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 14px;
  }
  .back-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
    font-size: 1.2rem;
  }
  .back-btn:hover { background: rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.4); }
  .back-btn:active { transform: scale(0.95); }
  .page-title { flex: 1; min-width: 0; }
  .page-title-main { font-size: 1.1rem; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-title-sub { font-size: 0.72rem; color: #90b8ff; font-weight: 700; margin-top: 2px; }

  .topics-container { padding-bottom: 60px; }
  .topic-card {
    background: rgba(8, 12, 24, 0.7);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px; margin-bottom: 12px;
    cursor: pointer; transition: all 0.3s ease;
    padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .topic-card:hover { border-color: rgba(107,158,255,0.4); transform: translateX(4px); }
  .topic-icon {
    font-size: 1.4rem; width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(107,158,255,0.15), rgba(168,85,247,0.15));
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .topic-info { flex: 1; min-width: 0; }
  .topic-title { font-size: 0.95rem; font-weight: 800; color: #fff; margin-bottom: 3px; }
  .topic-desc { font-size: 0.72rem; color: #90b8ff; font-weight: 600; }
  .topic-arrow { color: #6b9eff; font-size: 1rem; }

  /* ============ TOPIC PAGE (Lessons + Practice) ============ */
  .topic-page { display: none; padding: 20px; max-width: 900px; margin: 0 auto; min-height: 100vh; }
  .topic-page.active { display: block; }

  .lesson-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
  .lesson-tab {
    flex-shrink: 0; padding: 10px 16px; border-radius: 30px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: #8b97b8; font-size: 0.78rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
  }
  .lesson-tab:hover { background: rgba(107,158,255,0.1); }
  .lesson-tab.active {
    background: linear-gradient(135deg, #3b82f6, #6d5dfc);
    border-color: transparent; color: #fff;
    box-shadow: 0 6px 20px rgba(59,130,246,0.4);
  }

  .lesson-body { padding-bottom: 40px; }

  /* Info block */
  .info-block {
    background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(168,85,247,0.08));
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 20px; padding: 22px 20px; margin-bottom: 20px;
  }
  .info-block h3 { font-size: 1rem; font-weight: 900; color: #fff; margin-bottom: 12px; }
  .info-block p { font-size: 0.9rem; color: #b8c4e0; line-height: 1.7; margin-bottom: 8px; }
  .info-block b { color: #a5d8ff; }

  /* Examples grid */
  .examples-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .example-row {
    background: rgba(0,0,0,0.35); border-radius: 14px;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.2s ease;
  }
  .example-row:hover { border-color: rgba(107,158,255,0.3); background: rgba(59,130,246,0.08); }
  .example-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 900; color: #fff; flex-shrink: 0;
  }
  .example-content { flex: 1; min-width: 0; }
  .example-main { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .example-sub { font-size: 0.78rem; color: #90b8ff; font-weight: 600; }

  /* Slot game (word bank → slots) */
  .game-slot-container {
    background: rgba(8, 12, 24, 0.7);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 22px; padding: 24px 20px; margin-bottom: 16px;
  }
  .slot-instruction { text-align: center; font-size: 0.85rem; color: #90b8ff; font-weight: 700; margin-bottom: 18px; }
  .slot-label { font-size: 0.7rem; color: #7a8ba8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: center; }
  .slot-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .slot {
    min-width: 80px; height: 48px; padding: 0 12px;
    border: 2px dashed rgba(255,255,255,0.15); border-radius: 12px;
    background: rgba(0,0,0,0.35); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 800;
    cursor: pointer; transition: all 0.25s ease;
    position: relative;
  }
  .slot.filled { border-style: solid; border-color: #3b82f6; background: rgba(59,130,246,0.15); }
  .slot.correct { border-color: #22c55e; background: rgba(34,197,94,0.2); color: #86efac; }
  .slot.wrong { border-color: #ef4444; background: rgba(239,68,68,0.2); color: #fca5a5; animation: shake 0.4s ease; }
  .slot.active { border-color: #6b9eff; background: rgba(107,158,255,0.15); animation: pulseSlot 1s infinite; }
  @keyframes pulseSlot { 0%,100% { box-shadow: 0 0 0 0 rgba(107,158,255,0.5); } 50% { box-shadow: 0 0 0 6px rgba(107,158,255,0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .word-bank { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
  .word-chip {
    padding: 10px 16px; border-radius: 12px;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.18);
    color: #fff; font-size: 0.9rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s ease; user-select: none;
  }
  .word-chip:hover { background: linear-gradient(145deg, rgba(139,92,246,0.4), rgba(59,130,246,0.4)); transform: translateY(-3px); }
  .word-chip:active { transform: translateY(-1px) scale(0.98); }
  .word-chip.used { opacity: 0.3; pointer-events: none; }

  /* MCQ game */
  .mcq-container {
    background: rgba(8, 12, 24, 0.7);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 22px; padding: 24px 20px; margin-bottom: 16px;
  }
  .mcq-question { font-size: 1.05rem; font-weight: 800; color: #fff; text-align: center; margin-bottom: 20px; line-height: 1.5; }
  .mcq-options { display: flex; flex-direction: column; gap: 10px; }
  .mcq-option {
    padding: 14px 18px; border-radius: 14px;
    background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.08);
    color: #e2e8f0; font-size: 0.92rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s ease;
    display: flex; align-items: center; gap: 12px;
  }
  .mcq-option:hover { border-color: rgba(107,158,255,0.5); background: rgba(107,158,255,0.08); transform: translateX(4px); }
  .mcq-option.correct { border-color: #22c55e; background: rgba(34,197,94,0.15); color: #86efac; }
  .mcq-option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.15); color: #fca5a5; animation: shake 0.4s ease; }
  .mcq-option-letter {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(107,158,255,0.2); color: #a5d8ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 900; flex-shrink: 0;
  }
  .mcq-option.correct .mcq-option-letter { background: rgba(34,197,94,0.3); color: #86efac; }
  .mcq-option.wrong .mcq-option-letter { background: rgba(239,68,68,0.3); color: #fca5a5; }

  .game-feedback { min-height: 26px; text-align: center; font-size: 0.9rem; font-weight: 800; margin-top: 14px; }
  .game-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px;
  }
  .g-stat { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .g-stat-value { font-size: 1.2rem; font-weight: 900; background: linear-gradient(135deg, #a5d8ff, #b197fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .g-stat-label { font-size: 0.58rem; color: #90b8ff; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-top: 2px; }

  .game-actions { display: flex; gap: 10px; margin-top: 16px; }
  .g-btn { flex: 1; padding: 13px 18px; border-radius: 60px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .g-btn-secondary { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; }
  .g-btn-secondary:hover { background: rgba(255,255,255,0.12); }
  .g-btn-primary { background: linear-gradient(135deg, #3b82f6, #6d5dfc); color: #fff; box-shadow: 0 8px 24px rgba(59,130,246,0.4); }
  .g-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(59,130,246,0.6); }

  .game-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .game-progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; }
  .game-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #a855f7); transition: width 0.3s ease; }
  .game-progress-text { font-size: 0.75rem; color: #90b8ff; font-weight: 800; flex-shrink: 0; }

  /* Module 5 (WordMeaning game) */
  .game-screen { display: none; padding: 20px; max-width: 760px; margin: 0 auto; min-height: 100vh; }
  .game-screen.active { display: block; }
  .game-word-card {
    background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(168,85,247,0.12));
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 26px; padding: 24px 20px; text-align: center;
    margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .game-word-card::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(139,92,246,0.15), transparent 60%);
    animation: rotateGlow 8s linear infinite; pointer-events: none;
  }
  @keyframes rotateGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .game-emoji { font-size: 3rem; display: block; margin-bottom: 8px; position: relative; animation: floatEmoji 3s ease-in-out infinite; }
  @keyframes floatEmoji { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .game-word { font-size: 2.2rem; font-weight: 900; letter-spacing: 6px; color: #fff; text-shadow: 0 0 30px rgba(139,92,246,0.7); margin-bottom: 14px; position: relative; }
  .game-meanings { display: flex; flex-direction: column; gap: 8px; position: relative; }
  .game-meaning-row { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .game-meaning-lang { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; color: #90b8ff; font-weight: 800; flex-shrink: 0; min-width: 70px; background: rgba(59,130,246,0.15); padding: 4px 8px; border-radius: 6px; text-align: center; }
  .game-meaning-pron { font-size: 1rem; color: #fff; font-weight: 700; }
  .game-meaning-pron .dash { color: #90b8ff; margin: 0 6px; }
  .game-meaning-pron .hindi-meaning { color: #86efac; }

  .game-pattern { display: flex; justify-content: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .pattern-cell { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 900; text-transform: uppercase; transition: all 0.25s ease; }
  .pattern-cell.solved { background: rgba(34,197,94,0.22); border: 2px solid #22c55e; color: #86efac; }
  .pattern-cell.empty { background: rgba(255,255,255,0.04); border: 2px dashed rgba(255,255,255,0.15); color: transparent; }
  .pattern-cell.active { background: rgba(59,130,246,0.28); border: 2px solid #3b82f6; color: #fff; animation: pulseActive 1.1s infinite; }
  @keyframes pulseActive { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

  .game-letters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
  .letter-chip { width: 46px; height: 46px; background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06)); border: 1px solid rgba(255,255,255,0.18); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 900; color: white; cursor: pointer; transition: all 0.15s ease; text-transform: uppercase; user-select: none; }
  .letter-chip:hover { background: linear-gradient(145deg, rgba(139,92,246,0.5), rgba(59,130,246,0.5)); transform: translateY(-4px); }

  /* Confetti */
  .confetti-pop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; z-index: 999; animation: popFade 1.3s ease forwards; pointer-events: none; }
  @keyframes popFade { 0% { opacity: 0; transform: translate(-50%,-30%) scale(0.4); } 30% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); } 70% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-70%) scale(0.8); } }

  /* Loading */
  .loading { text-align: center; padding: 60px 20px; color: #90b8ff; font-size: 0.9rem; }
  .loading-spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(107,158,255,0.3); border-top-color: #6b9eff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile */
  @media (max-width: 640px) {
    .home { padding: 20px 16px 60px; }
    .home-title { font-size: 1.5rem; }
    .home-logo { width: 68px; height: 68px; font-size: 2rem; }
    .module-card { padding: 22px 18px; }
    .module-title { font-size: 1rem; }
    .game-word { font-size: 1.7rem; letter-spacing: 4px; }
    .letter-chip { width: 40px; height: 40px; font-size: 1.1rem; }
    .pattern-cell { width: 38px; height: 38px; font-size: 1.1rem; }
    .slot { min-width: 60px; height: 42px; font-size: 0.85rem; }
    .g-stat-value { font-size: 1rem; }
    .game-meaning-pron { font-size: 0.9rem; }
  }
</style>
</head>
<body>
<canvas id="three-canvas"></canvas>
<div class="vignette"></div>

<div id="app">
  <!-- HOME -->
  <div class="home" id="home-page">
    <div class="home-header">

function renderLesson(idx) {
  const body = document.getElementById('lesson-body');
  const lessons = currentTopic.lessons || [];

  if (idx >= lessons.length) {
    // Practice Quiz
    startPracticeQuiz();
    return;
  }

  const lesson = lessons[idx];
  let html = '';

  // Info lesson
  if (lesson.type === 'info') {
    html += `<div class="info-block">`;
    if (lesson.content) html += lesson.content;
    html += `</div>`;
  }

  // Slot game lesson
  if (lesson.type === 'slot') {
    html += renderSlotGame(lesson);
    body.innerHTML = html;
    initSlotGame(lesson);
    return;
  }

  // Examples
  if (lesson.examples && lesson.examples.length > 0) {
    html += `<div class="examples-grid">`;
    lesson.examples.forEach((ex, i) => {
      let main = '', sub = '';
      if (ex.sentence) { main = ex.sentence; sub = ex.hi || ''; }
      else if (ex.en) { main = ex.en; sub = ex.hi || ''; }
      else if (ex.s && ex.v && ex.o) { main = `${ex.s} ${ex.v} ${ex.o}`; sub = ''; }
      else if (ex.letter && ex.sound) { main = `${ex.letter} — ${ex.sound}`; sub = ex.word || ''; }
      else if (ex.word1 && ex.word2) { main = `${ex.word1} ↔ ${ex.word2}`; sub = ''; }
      else if (ex.active && ex.passive) { main = `Active: ${ex.active}`; sub = `Passive: ${ex.passive}`; }
      else if (ex.article && ex.word) { main = `${ex.article} ${ex.word}`; sub = ex.sentence || ''; }
      else if (ex.type && ex.letter) { main = `${ex.letter} (${ex.type})`; sub = ex.example || ''; }
      else if (ex.type && ex.example) { main = `${ex.type}: ${ex.example}`; sub = ''; }
      else if (ex.word && ex.meaning) { main = `${ex.word} — ${ex.meaning}`; sub = ''; }
      else if (ex.part && ex.example) { main = `${ex.part}: ${ex.example}`; sub = ''; }
      else { main = JSON.stringify(ex); }

      html += `
        <div class="example-row">
          <div class="example-num">${i + 1}</div>
          <div class="example-content">
            <div class="example-main">${escapeHtml(main)}</div>
            ${sub ? `<div class="example-sub">${escapeHtml(sub)}</div>` : ''}
          </div>
        </div>`;
    });
    html += `</div>`;
  }

  body.innerHTML = html;
}

// ============================================================
// SLOT GAME (Word Bank → Slots)
// ============================================================
let slotGameState = null;

function renderSlotGame(lesson) {
  return `
    <div class="game-slot-container">
      <div class="slot-instruction">${lesson.instruction || 'Words को सही order में रखो'}</div>
      <div class="slot-label">👇 यहाँ words रखो</div>
      <div class="slot-row" id="slot-row"></div>
      <div class="slot-label">🎯 Word Bank (click to place)</div>
      <div class="word-bank" id="word-bank"></div>
      <div class="game-feedback" id="slot-feedback"></div>
      <div class="game-progress">
        <span class="game-progress-text" id="slot-progress-text">1 / ${lesson.questions.length}</span>
        <div class="game-progress-bar"><div class="game-progress-fill" id="slot-progress-fill"></div></div>
      </div>
      <div class="game-actions">
        <button class="g-btn g-btn-secondary" onclick="resetSlotGame()">🔁 Reset</button>
        <button class="g-btn g-btn-primary" id="slot-next-btn" onclick="nextSlotQuestion()">➡️ Next</button>
      </div>
    </div>
  `;
}

function initSlotGame(lesson) {
  slotGameState = {
    lesson,
    qIdx: 0,
    placed: [],
    score: 0,
    wrong: 0
  };
  loadSlotQuestion();
}

function loadSlotQuestion() {
  const st = slotGameState;
  const q = st.lesson.questions[st.qIdx];
  st.placed = new Array(q.answer.length).fill(null);
  st.usedWordIdx = new Set();

  // Shuffle words
  st.shuffledWords = [...q.words].sort(() => Math.random() - 0.5);

  renderSlotUI();
}

function renderSlotUI() {
  const st = slotGameState;
  if (!st) return;
  const q = st.lesson.questions[st.qIdx];

  // Slots
  const slotRow = document.getElementById('slot-row');
  if (!slotRow) return;
  slotRow.innerHTML = q.answer.map((_, i) => {
    const val = st.placed[i];
    const cls = val ? 'slot filled' : 'slot active';
    return `<div class="${cls}">${val || '?'}</div>`;
  }).join('');

  // Word bank
  const bank = document.getElementById('word-bank');
  bank.innerHTML = st.shuffledWords.map((w, i) => {
    const used = st.usedWordIdx.has(i);
    return `<div class="word-chip ${used ? 'used' : ''}" onclick="placeWord(${i})">${w}</div>`;
  }).join('');

  // Progress
  document.getElementById('slot-progress-text').textContent = `${st.qIdx + 1} / ${st.lesson.questions.length}`;
  document.getElementById('slot-progress-fill').style.width = `${((st.qIdx + 1) / st.lesson.questions.length) * 100}%`;

  // Feedback
  const fb = document.getElementById('slot-feedback');
  const correct = st.placed.every((v, i) => v === q.answer[i]) && st.placed.every(v => v !== null);
  if (correct) {
    fb.style.color = '#86efac';
    fb.textContent = '🎉 Correct! Next question →';
  } else {
    fb.style.color = '#90b8ff';
    fb.textContent = `${st.placed.filter(x => x).length} / ${q.answer.length} words placed`;
  }
}

function placeWord(wordIdx) {
  const st = slotGameState;
  if (!st || st.usedWordIdx.has(wordIdx)) return;
  const nextEmpty = st.placed.findIndex(v => v === null);
  if (nextEmpty === -1) return;

  st.placed[nextEmpty] = st.shuffledWords[wordIdx];
  st.usedWordIdx.add(wordIdx);

  // Check if fully placed
  const q = st.lesson.questions[st.qIdx];
  if (st.placed.every(v => v !== null)) {
    const isCorrect = st.placed.every((v, i) => v === q.answer[i]);
    if (isCorrect) {
      st.score += 10;
    } else {
      st.wrong++;
      showToast('✗ Wrong order, try again', 'error');
    }
  }
  renderSlotUI();
}

function resetSlotGame() {
  if (!slotGameState) return;
  loadSlotQuestion();
}

function nextSlotQuestion() {
  const st = slotGameState;
  if (!st) return;
  if (st.qIdx < st.lesson.questions.length - 1) {
    st.qIdx++;
    loadSlotQuestion();
  } else {
    showToast('🎉 Practice complete!', 'success');
    showConfetti();
  }
}

// MCQ PRACTICE
// ============================================================
let mcqState = null;

function startPracticeQuiz() {
  mcqState = {
    questions: currentTopic.practice,
    idx: 0,
    score: 0,
    wrong: 0
  };
  loadMCQ();
}

function loadMCQ() {
  const body = document.getElementById('lesson-body');
  const st = mcqState;
  const q = st.questions[st.idx];

  body.innerHTML = `
    <div class="game-progress">
      <span class="game-progress-text">${st.idx + 1} / ${st.questions.length}</span>
      <div class="game-progress-bar"><div class="game-progress-fill" style="width:${((st.idx+1)/st.questions.length)*100}%"></div></div>
    </div>
    <div class="mcq-container">
      <div class="mcq-question">${escapeHtml(q.q)}</div>
      <div class="mcq-options" id="mcq-options">
        ${q.options.map((opt, i) => `
          <div class="mcq-option" data-idx="${i}" onclick="selectMCQ(${i})">
            <div class="mcq-option-letter">${String.fromCharCode(65 + i)}</div>
            <div>${escapeHtml(opt)}</div>
          </div>
        `).join('')}
      </div>
      <div class="game-feedback" id="mcq-feedback"></div>
    </div>
    <div class="game-actions">
      <button class="g-btn g-btn-secondary" onclick="restartMCQ()">🔁 Restart</button>
      <button class="g-btn g-btn-primary" id="mcq-next-btn" onclick="nextMCQ()" style="display:none;">➡️ Next</button>
    </div>
  `;
}

function selectMCQ(idx) {
  const st = mcqState;
  const q = st.questions[st.idx];
  const options = document.querySelectorAll('.mcq-option');
  const fb = document.getElementById('mcq-feedback');

  options.forEach(o => o.style.pointerEvents = 'none');

  const isCorrect = q.options[idx] === q.answer;
  if (isCorrect) {
    options[idx].classList.add('correct');
    fb.style.color = '#86efac';
    fb.textContent = '✅ Correct!';
    st.score += 10;
    showConfetti();
  } else {
    options[idx].classList.add('wrong');
    const correctIdx = q.options.indexOf(q.answer);
    if (correctIdx >= 0) options[correctIdx].classList.add('correct');
    fb.style.color = '#fca5a5';
    fb.textContent = `❌ Wrong. Correct answer: ${q.answer}`;
    st.wrong++;
  }

  document.getElementById('mcq-next-btn').style.display = 'flex';
}

function nextMCQ() {
  const st = mcqState;
  if (st.idx < st.questions.length - 1) {
    st.idx++;
    loadMCQ();
  } else {
    const total = st.questions.length;
    const pct = Math.round((st.score / (total * 10)) * 100);
    document.getElementById('lesson-body').innerHTML = `
      <div class="info-block" style="text-align:center;">
        <h3 style="font-size:1.5rem;margin-bottom:14px;">🎉 Quiz Complete!</h3>
        <p style="font-size:1.1rem;margin-bottom:8px;">Score: <b>${st.score}</b> / ${total * 10}</p>
        <p style="font-size:1.1rem;margin-bottom:16px;">Correct: <b style="color:#86efac;">${total - st.wrong}</b> · Wrong: <b style="color:#fca5a5;">${st.wrong}</b></p>
        <button class="g-btn g-btn-primary" onclick="restartMCQ()" style="max-width:200px;margin:0 auto;">🔁 Try Again</button>
      </div>
    `;
    showConfetti();
  }
}

function restartMCQ() {
  startPracticeQuiz();
}

// ============================================================
// MODULE 5 — WORD MEANING GAME
// ============================================================
let gameState = { currentWord: null, bank: [], currentIndex: 0, solved: false, score: 0, streak: 0, correctCount: 0, wrongCount: 0 };

function newGameWord() {
  const entry = WORDS[Math.floor(Math.random() * WORDS.length)];
  const word = entry.word;
  const extras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const bank = word.split('');
  for (let i = 0; i < 4; i++) bank.push(extras[Math.floor(Math.random() * extras.length)]);
  bank.sort(() => Math.random() - 0.5);

  gameState.currentWord = entry;
  gameState.bank = bank;
  gameState.currentIndex = 0;
  gameState.solved = false;
  renderGame();
}

function renderGame() {
  const entry = gameState.currentWord;
  if (!entry) return;
  const target = entry.word;

  document.getElementById('game-emoji').textContent = entry.emoji;
  document.getElementById('game-word').textContent = target;

  document.getElementById('game-meanings').innerHTML = LANGUAGES.map(lang => {
    const data = entry[lang.code];
    if (!data) return '';
    if (lang.code === 'hi') {
      return `<div class="game-meaning-row"><span class="game-meaning-lang">${lang.name}</span><div class="game-meaning-pron">${data.pron} <span class="dash">—</span> <span class="hindi-meaning">${data.meaning}</span></div></div>`;
    }
    return `<div class="game-meaning-row"><span class="game-meaning-lang">${lang.name}</span><div class="game-meaning-pron">${data.pron}</div></div>`;
  }).join('');

  document.getElementById('game-pattern').innerHTML = target.split('').map((ch, i) => {
    if (i < gameState.currentIndex) return `<div class="pattern-cell solved">${ch}</div>`;
    if (i === gameState.currentIndex && !gameState.solved) return `<div class="pattern-cell active">?</div>`;
    return `<div class="pattern-cell empty"></div>`;
  }).join('');

  const used = target.slice(0, gameState.currentIndex).split('');
  const remaining = [...gameState.bank];
  used.forEach(l => { const idx = remaining.indexOf(l); if (idx > -1) remaining.splice(idx, 1); });
  document.getElementById('game-letters').innerHTML = remaining.map(ch => `<div class="letter-chip" onclick="handleLetterClick('${ch}', this)">${ch}</div>`).join('');

  document.getElementById('g-score').textContent = gameState.score;
  document.getElementById('g-streak').textContent = gameState.streak;
  document.getElementById('g-correct').textContent = gameState.correctCount;
  document.getElementById('g-wrong').textContent = gameState.wrongCount;

  const fb = document.getElementById('game-feedback');
  if (gameState.solved) { fb.style.color = '#86efac'; fb.textContent = '🎉 Perfect!'; }
  else { fb.style.color = '#90b8ff'; fb.textContent = `${gameState.currentIndex}/${target.length} letters placed`; }
}

function handleLetterClick(letter, el) {
  if (gameState.solved) return;
  const target = gameState.currentWord.word;
  const expected = target[gameState.currentIndex];

  if (letter === expected) {
    gameState.currentIndex++;
    gameState.correctCount++;
    gameState.streak++;
    gameState.score += 10;
    if (gameState.currentIndex === target.length) {
      gameState.solved = true;
      gameState.score += 50;
      renderGame();
      showConfetti();
      return;
    }
    renderGame();
  } else {
    gameState.wrongCount++;
    gameState.streak = 0;
    gameState.score = Math.max(0, gameState.score - 2);
    el.style.background = 'rgba(239,68,68,0.4)';
    el.style.borderColor = '#ef4444';
    setTimeout(() => { el.style.background = ''; el.style.borderColor = ''; }, 400);
    const fb = document.getElementById('game-feedback');
    fb.style.color = '#fca5a5';
    fb.textContent = `✗ Wrong. Next letter is "${expected}"`;
    document.getElementById('g-score').textContent = gameState.score;
    document.getElementById('g-streak').textContent = gameState.streak;
    document.getElementById('g-wrong').textContent = gameState.wrongCount;
  }
}

// ============================================================
// UTILS
// ============================================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showConfetti() {
  const pop = document.createElement('div');
  pop.className = 'confetti-pop';
  pop.textContent = '🎉';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 1400);
}

function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(15,20,35,0.98);border:1px solid rgba(139,92,246,0.4);color:#fff;padding:11px 18px;border-radius:13px;font-size:0.83rem;font-weight:600;z-index:999;box-shadow:0 16px 40px rgba(0,0,0,0.7);`;
  t.textContent = (type === 'error' ? '❌ ' : type === 'success' ? '✅ ' : 'ℹ️ ') + msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ============================================================
// 3D BACKGROUND
// ============================================================
(function initThree() {
  const canvas = document.getElementById('three-canvas');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x02030a, 0.025);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 1, 16);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x02030a, 1);

  scene.add(new THREE.AmbientLight(0x1a2540, 1.4));
  const p1 = new THREE.PointLight(0x6b9eff, 2.5, 80); p1.position.set(12, 10, 12); scene.add(p1);
  const p2 = new THREE.PointLight(0xa855f7, 2, 80); p2.position.set(-12, -6, 10); scene.add(p2);
  const p3 = new THREE.PointLight(0x06b6d4, 1.8, 80); p3.position.set(0, 14, -10); scene.add(p3);

  const floaters = [];
  const colors = [0x3b82f6, 0x6b9eff, 0xa855f7, 0x8b5cf6, 0x06b6d4, 0xec4899];
  for (let i = 0; i < 20; i++) {
    const geo = new THREE.BoxGeometry(0.8 + Math.random() * 0.5, 0.8 + Math.random() * 0.5, 0.8 + Math.random() * 0.5);
    const mat = new THREE.MeshStandardMaterial({ color: colors[i % colors.length], wireframe: true, transparent: true, opacity: 0.5, emissive: colors[i % colors.length], emissiveIntensity: 0.5 });
    const mesh = new THREE.Mesh(geo, mat);
    const angle = (i / 20) * Math.PI * 2;
    const radius = 9 + Math.random() * 4;
    mesh.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 12, Math.sin(angle) * radius - 5);
    mesh.userData = { rotX: (Math.random() - 0.5) * 0.01, rotY: (Math.random() - 0.5) * 0.01, floatSpeed: 0.3 + Math.random() * 0.5, floatAmp: 0.5 + Math.random() * 0.6, baseY: mesh.position.y, offset: Math.random() * Math.PI * 2 };
    scene.add(mesh); floaters.push(mesh);
  }

  const starCount = 500;
  const starPos = new Float32Array(starCount * 3);
  const starCol = new Float32Array(starCount * 3);
  const palette = [new THREE.Color(0x3b82f6), new THREE.Color(0xa855f7), new THREE.Color(0x06b6d4), new THREE.Color(0xffffff)];
  for (let i = 0; i < starCount; i++) {
    starPos[i*3] = (Math.random() - 0.5) * 60;
    starPos[i*3+1] = (Math.random() - 0.5) * 45;
    starPos[i*3+2] = (Math.random() - 0.5) * 45 - 10;
    const c = palette[Math.floor(Math.random() * palette.length)];
    starCol[i*3] = c.r; starCol[i*3+1] = c.g; starCol[i*3+2] = c.b;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(stars);

  let mouseX = 0, mouseY = 0, tX = 0, tY = 0;
  addEventListener('mousemove', (e) => { mouseX = (e.clientX / innerWidth - 0.5) * 2; mouseY = (e.clientY / innerHeight - 0.5) * 2; });
  addEventListener('touchmove', (e) => { if (e.touches[0]) { mouseX = (e.touches[0].clientX / innerWidth - 0.5) * 2; mouseY = (e.touches[0].clientY / innerHeight - 0.5) * 2; } }, { passive: true });

  const clock = new THREE.Clock();
  (function animate() {
    const t = clock.getElapsedTime();
    tX += (mouseX - tX) * 0.05;
    tY += (mouseY - tY) * 0.05;
    camera.position.x = tX * 2;
    camera.position.y = 1 - tY * 2;
    camera.lookAt(0, 0, 0);
    floaters.forEach(f => {
      f.rotation.x += f.userData.rotX;
      f.rotation.y += f.userData.rotY;
      f.position.y = f.userData.baseY + Math.sin(t * f.userData.floatSpeed + f.userData.offset) * f.userData.floatAmp;
    });
    stars.rotation.y = t * 0.02;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  })();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
