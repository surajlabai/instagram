<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Mastery · All Modules</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
  body { background: #0a0e1a; color: #fff; min-height: 100vh; padding: 20px; }
  .container { max-width: 1000px; margin: 0 auto; }

  .header { text-align: center; padding: 30px 0; }
  .header h1 { font-size: 2rem; color: #60a5fa; margin-bottom: 8px; }
  .header p { color: #94a3b8; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 30px; }
  .card { background: #131828; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; cursor: pointer; transition: all 0.3s; }
  .card:hover { border-color: #60a5fa; transform: translateY(-4px); }
  .card-icon { font-size: 2rem; margin-bottom: 12px; }
  .card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
  .card-desc { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; }
  .card.disabled { opacity: 0.5; cursor: not-allowed; }
  .card.disabled:hover { border-color: #1e293b; transform: none; }
  .badge { display: inline-block; background: #1e293b; color: #94a3b8; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; margin-top: 8px; font-weight: 700; }
  .badge.ready { background: #064e3b; color: #4ade80; }

  .detail-page { display: none; }
  .detail-page.active { display: block; }
  .back-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; }
  .back-btn:hover { background: #334155; }
  .detail-header { margin-bottom: 24px; }
  .detail-header h2 { font-size: 1.6rem; margin-bottom: 6px; }
  .detail-header p { color: #94a3b8; font-size: 0.9rem; }

  .letters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .letter-card { background: #131828; border: 2px solid #1e293b; border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.25s; }
  .letter-card:hover { border-color: #60a5fa; transform: translateY(-4px); }
  .letter-big { font-size: 2rem; font-weight: 900; color: #60a5fa; margin-bottom: 4px; }
  .letter-small { font-size: 1.2rem; color: #94a3b8; margin-bottom: 6px; }
  .letter-sound { font-size: 0.8rem; color: #4ade80; font-weight: 700; }
  .letter-examples { font-size: 0.62rem; color: #94a3b8; margin-top: 4px; line-height: 1.3; }

  .list-item { background: #131828; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
  .list-item:hover { border-color: #60a5fa; background: #1a2035; }
  .list-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
  .list-sub { font-size: 0.8rem; color: #94a3b8; }

  .menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .menu-btn { background: #131828; border: 2px solid #1e293b; border-radius: 14px; padding: 20px 16px; cursor: pointer; transition: all 0.25s; text-align: center; }
  .menu-btn:hover { border-color: #60a5fa; transform: translateY(-3px); }
  .menu-btn .icon { font-size: 2rem; margin-bottom: 8px; }
  .menu-btn .title { font-size: 0.95rem; font-weight: 800; margin-bottom: 4px; }
  .menu-btn .sub { font-size: 0.75rem; color: #94a3b8; }

  .sound-category { background: #131828; border: 2px solid #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; gap: 16px; }
  .sound-category:hover { border-color: #60a5fa; transform: translateX(4px); }
  .sound-cat-icon { font-size: 2rem; width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #1e3a5f, #2a1a4a); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sound-cat-info { flex: 1; }
  .sound-cat-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .sound-cat-desc { font-size: 0.8rem; color: #94a3b8; }

  .sound-item { background: #131828; border: 2px solid #1e293b; border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.25s; }
  .sound-item:hover { border-color: #60a5fa; transform: translateY(-4px); }
  .sound-symbol { font-size: 1.5rem; font-weight: 900; color: #60a5fa; margin-bottom: 6px; }
  .sound-desc { font-size: 0.82rem; color: #4ade80; font-weight: 700; margin-bottom: 6px; }
  .sound-example { font-size: 0.68rem; color: #94a3b8; line-height: 1.3; }

  .verb-letters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; justify-content: center; }
  .verb-letter-btn { width: 44px; height: 44px; border-radius: 10px; background: #131828; border: 2px solid #1e293b; color: #fff; font-size: 1rem; font-weight: 900; cursor: pointer; transition: all 0.2s; }
  .verb-letter-btn:hover { border-color: #60a5fa; }
  .verb-letter-btn.active { background: #60a5fa; border-color: #60a5fa; color: #0a0e1a; }
  .verb-letter-btn.all-btn { width: 70px; font-size: 0.8rem; }

  .verb-row { background: #131828; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; transition: all 0.2s; display: grid; grid-template-columns: 1.5fr 1.5fr 1.5fr 1.5fr; gap: 12px; align-items: center; }
  .verb-row:hover { border-color: #60a5fa; background: #1a2035; }
  .verb-row-v1 { font-size: 0.95rem; font-weight: 800; color: #fff; }
  .verb-row-v2 { font-size: 0.9rem; color: #60a5fa; font-weight: 700; }
  .verb-row-v3 { font-size: 0.9rem; color: #a78bfa; font-weight: 700; }
  .verb-row-hi { font-size: 0.8rem; color: #4ade80; font-weight: 700; }

  .be-verb-header { text-align: center; padding: 24px; border-radius: 16px; background: linear-gradient(135deg, #1e3a5f, #2a1a4a); margin-bottom: 20px; }
  .be-verb-word-big { font-size: 2.5rem; font-weight: 900; color: #60a5fa; margin-bottom: 8px; }
  .be-verb-meaning { font-size: 1.3rem; font-weight: 800; color: #4ade80; margin-bottom: 8px; }
  .be-verb-usage-text { font-size: 0.9rem; color: #cbd5e1; }
  .example-block { margin-bottom: 16px; }
  .example-block-title { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 800; }
  .example-row { background: #131828; border: 1px solid #1e293b; border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; }
  .example-en { font-size: 0.95rem; color: #fff; font-weight: 700; margin-bottom: 4px; }
  .example-hi { font-size: 0.8rem; color: #94a3b8; }

  /* MODULE 2 STYLES */
  .topic-item { background: linear-gradient(135deg, #131828, #1a2035); border: 2px solid #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 12px; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; gap: 16px; }
  .topic-item:hover { border-color: #60a5fa; transform: translateX(4px); }
  .topic-icon { font-size: 1.8rem; width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #1e3a5f, #2a1a4a); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .topic-info { flex: 1; }
  .topic-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .topic-intro { font-size: 0.8rem; color: #94a3b8; }
  .topic-count { font-size: 0.72rem; color: #4ade80; font-weight: 700; margin-top: 4px; }

  .lesson-card { background: #131828; border: 1px solid #1e293b; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .lesson-title { font-size: 1.05rem; font-weight: 800; color: #60a5fa; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #1e293b; }
  .lesson-content { font-size: 0.9rem; color: #cbd5e1; line-height: 1.7; margin-bottom: 12px; }
  .lesson-content p { margin-bottom: 6px; }
  .lesson-example { background: #0f1420; border-left: 3px solid #60a5fa; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .lesson-example .en { font-size: 0.9rem; color: #fff; font-weight: 700; margin-bottom: 3px; }
  .lesson-example .hi { font-size: 0.8rem; color: #94a3b8; }
  .lesson-example .pair { display: flex; align-items: center; gap: 12px; font-size: 0.92rem; }
  .lesson-example .pair .w1 { color: #4ade80; font-weight: 800; }
  .lesson-example .pair .arrow { color: #60a5fa; font-weight: 800; }
  .lesson-example .pair .w2 { color: #fbbf24; font-weight: 800; }

  .practice-btn-wrap { text-align: center; margin: 20px 0 40px; }

  /* GAME */
  .game-page { display: none; }
  .game-page.active { display: block; }
  .game-progress { background: #131828; border-radius: 100px; height: 8px; margin-bottom: 20px; overflow: hidden; }
  .game-progress-fill { background: #60a5fa; height: 100%; width: 0; transition: width 0.3s; }
  .game-question { background: #131828; border: 1px solid #334155; border-radius: 20px; padding: 30px 24px; text-align: center; margin-bottom: 20px; }
  .game-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 800; }
  .game-question-text { font-size: 1.3rem; font-weight: 800; line-height: 1.5; margin-bottom: 8px; }
  .game-question-hint { font-size: 0.9rem; color: #94a3b8; }
  .game-options { display: flex; flex-direction: column; gap: 10px; }
  .game-option { background: #131828; border: 2px solid #1e293b; border-radius: 14px; padding: 16px 20px; cursor: pointer; transition: all 0.2s; font-size: 1rem; font-weight: 700; text-align: left; color: #fff; display: flex; align-items: center; gap: 12px; }
  .game-option:hover { border-color: #60a5fa; }
  .game-option.correct { border-color: #4ade80; background: #1a3a1a; color: #4ade80; }
  .game-option.wrong { border-color: #f87171; background: #3a1a1a; color: #f87171; }
  .game-option-letter { width: 32px; height: 32px; border-radius: 8px; background: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }

  .sentence-hindi { font-size: 1.3rem; font-weight: 800; color: #4ade80; text-align: center; margin-bottom: 20px; }
  .sentence-slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0; min-height: 50px; padding: 12px; background: #0f1420; border-radius: 12px; border: 2px dashed #334155; }
  .sentence-slot { min-width: 60px; padding: 10px 14px; background: #1e293b; border-radius: 8px; font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.2s; }
  .sentence-slot:hover { background: #334155; }
  .sentence-slot.filled { background: #60a5fa; color: #0a0e1a; }

  .word-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px 0; }
  .word-chip { padding: 10px 16px; background: #1e293b; border: 2px solid #334155; border-radius: 10px; font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.2s; }
  .word-chip:hover { border-color: #60a5fa; transform: translateY(-3px); }
  .word-chip.used { opacity: 0.25; pointer-events: none; }

  .game-feedback { text-align: center; font-size: 1rem; font-weight: 800; margin: 16px 0; min-height: 24px; }
  .game-next { width: 100%; padding: 16px; background: #60a5fa; border: none; color: #fff; font-size: 1rem; font-weight: 800; border-radius: 14px; cursor: pointer; display: none; }
  .game-next.show { display: block; }

  .result-card { background: #131828; border: 1px solid #334155; border-radius: 20px; padding: 40px 24px; text-align: center; }
  .result-emoji { font-size: 4rem; margin-bottom: 16px; }
  .result-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 8px; color: #60a5fa; }
  .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .result-stat { background: #0f1420; border-radius: 12px; padding: 16px; }
  .result-stat-value { font-size: 1.6rem; font-weight: 900; color: #60a5fa; }
  .result-stat-label { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; text-transform: uppercase; }

  .btn { width: 100%; padding: 14px; border-radius: 12px; background: #60a5fa; border: none; color: #fff; font-size: 0.95rem; font-weight: 800; cursor: pointer; margin-bottom: 10px; }
  .btn.sec { background: #1e293b; }
  .btn:hover { opacity: 0.9; }

  .empty-state { text-align: center; padding: 60px 20px; color: #4a5568; }
  .empty-icon { font-size: 3rem; margin-bottom: 14px; opacity: 0.5; }
  .empty-text { font-size: 0.9rem; line-height: 1.6; }

  @media (max-width: 640px) {
    .menu-row { grid-template-columns: 1fr 1fr; gap: 8px; }
    .menu-btn { padding: 14px 8px; }
    .letter-big { font-size: 1.6rem; }
    .verb-row { grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 0.72rem; padding: 10px; }
    .verb-row-hi { grid-column: 1/-1; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="home-page" id="home-page">
    <div class="header">
      <h1>🌱 English Mastery</h1>
      <p>Choose a Module to start learning</p>
    </div>
    <div id="error-box" style="display:none; background:#3a1a1a; border:1px solid #f87171; color:#f87171; padding:16px; border-radius:12px; margin-bottom:20px; text-align:center; font-size:0.9rem;"></div>
    <div class="cards-grid" id="modules-grid"></div>
  </div>

  <div class="home-page" id="module-page" style="display:none">
    <button class="back-btn" onclick="goHome()">← All Modules</button>
    <div class="header" style="padding: 10px 0 20px;">
      <h1 id="module-title" style="font-size:1.6rem">Module</h1>
      <p id="module-sub">Cards</p>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <div class="detail-page" id="detail-page">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="detail-header">
      <h2 id="detail-title">Card</h2>
      <p id="detail-sub">Sub</p>
    </div>
    <div id="detail-content"></div>
  </div>

  <div class="game-page" id="game-page">
    <button class="back-btn" onclick="closeGame()">← Back</button>
    <div class="game-progress"><div class="game-progress-fill" id="game-progress-fill"></div></div>
    <div id="game-content"></div>
  </div>
</div>

<script src="module1.js" onerror="handleLoadError('module1.js')"></script>
<script src="module2.js" onerror="handleLoadError('module2.js')"></script>
<script src="module3.js" onerror="handleLoadError('module3.js')"></script>
<script src="module4.js" onerror="handleLoadError('module4.js')"></script>
<script src="module5.js" onerror="handleLoadError('module5.js')"></script>

<script>
// ═══════════════════════════════════════════════════════════
// ERROR HANDLER
// ═══════════════════════════════════════════════════════════
function handleLoadError(filename) {
  console.warn("⚠️ " + filename + " load nahi ho payi.");
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
var state = {
  currentModuleId: null,
  currentCard: null,
  currentCardIdx: 0,
  currentVerbLetter: 'all',
  currentBeVerbIdx: 0,
  currentModernVerbIdx: 0,
  currentTopicIdx: 0,
  gameQuestions: [],
  gameIdx: 0,
  gameCorrect: 0,
  gameWrong: 0,
  gameReturnFn: null,
  backStack: [],
  sentenceBuilder: null
};

// ═══════════════════════════════════════════════════════════
// MODULE DEFINITIONS (5 modules FIXED)
// ═══════════════════════════════════════════════════════════
var MODULE_DEFS = [
  { id: 'module1', num: 1, title: 'Module 1', icon: '📗', desc: 'Letters, Sounds, Verbs, Be Verbs, Modern Verbs' },
  { id: 'module2', num: 2, title: 'Module 2', icon: '🔥', desc: 'Intermediate English — Modals, Synonyms, Antonyms, Voice, Conditionals' },
  { id: 'module3', num: 3, title: 'Module 3', icon: '📙', desc: 'Coming soon...' },
  { id: 'module4', num: 4, title: 'Module 4', icon: '📕', desc: 'Coming soon...' },
  { id: 'module5', num: 5, title: 'Module 5', icon: '📓', desc: 'Coming soon...' }
];

// ═══════════════════════════════════════════════════════════
// AUTO-DETECT CARDS FOR ANY MODULE
// Ye function har module ke liye alag-alag variable names aur
// structures ko automatically detect karta hai.
// ═══════════════════════════════════════════════════════════
function getCardsForModule(moduleId) {
  var num = moduleId.replace('module', '');
  var cards = [];

  // -------- PATTERN 1: Standard cards (MODULEx_LETTERS, MODULEx_SOUNDS, etc.) --------
  // Ye Module 1 style hai
  var lettersVar = window['MODULE' + num + '_LETTERS'];
  var soundsVar  = window['MODULE' + num + '_SOUNDS'];
  var verbsVar   = window['MODULE' + num + '_VERBS'];
  var beVar      = window['MODULE' + num + '_BEVERBS'];
  var modVar     = window['MODULE' + num + '_MODERNVERBS'];

  if (lettersVar) cards.push(lettersVar);
  if (soundsVar)  cards.push(soundsVar);
  if (verbsVar)   cards.push(verbsVar);
  if (beVar)      cards.push(beVar);
  if (modVar)     cards.push(modVar);

  // -------- PATTERN 2: Single MODULEx object with topics (Module 2 style) --------
  var singleVar = window['MODULE' + num];
  if (singleVar && typeof singleVar === 'object' && singleVar.topics && Array.isArray(singleVar.topics)) {
    // Agar pehle se koi cards nahi mile (ya sirf singleVar available hai)
    if (cards.length === 0) {
      cards.push({
        id: 'm' + num + '_topics',
        title: singleVar.title || ('Module ' + num),
        icon: singleVar.icon || '📖',
        desc: singleVar.sub || singleVar.desc || 'Topics & Lessons',
        type: 'topics',
        topics: singleVar.topics,
        moduleData: singleVar
      });
    }
  }

  // -------- PATTERN 3: Multiple MODULEx_CARDS array --------
  var cardsArrVar = window['MODULE' + num + '_CARDS'];
  if (cardsArrVar && Array.isArray(cardsArrVar)) {
    cardsArrVar.forEach(function(c) { cards.push(c); });
  }

  return cards;
}

// ═══════════════════════════════════════════════════════════
// BACK STACK
// ═══════════════════════════════════════════════════════════
function pushBack(fn) { state.backStack.push(fn); }

function goBack() {
  if (state.backStack.length > 0) {
    var fn = state.backStack.pop();
    fn();
  } else {
    goHome();
  }
}

// ═══════════════════════════════════════════════════════════
// PAGE 1: HOME
// ═══════════════════════════════════════════════════════════
function goHome() {
  state.backStack = [];
  state.currentModuleId = null;
  document.getElementById('home-page').style.display = 'block';
  document.getElementById('module-page').style.display = 'none';
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('game-page').classList.remove('active');
  renderModules();
  window.scrollTo(0, 0);
}

function renderModules() {
  var grid = document.getElementById('modules-grid');
  grid.innerHTML = MODULE_DEFS.map(function(m) {
    var cards = getCardsForModule(m.id);
    var ready = cards.length > 0;
    var badge = ready
      ? '<div class="badge ready">✅ ' + cards.length + ' card' + (cards.length > 1 ? 's' : '') + ' ready</div>'
      : '<div class="badge">⏳ Coming soon</div>';
    var cls = ready ? 'card' : 'card disabled';
    var onclick = ready ? 'openModule(\'' + m.id + '\')' : '';
    // Desc update karo agar module ka apna desc mile
    var desc = m.desc;
    if (ready && cards[0] && cards[0].desc && m.id !== 'module1' && m.id !== 'module2') {
      desc = cards[0].desc;
    }
    return '<div class="' + cls + '" onclick="' + onclick + '">' +
      '<div class="card-icon">' + m.icon + '</div>' +
      '<div class="card-title">' + m.title + '</div>' +
      '<div class="card-desc">' + desc + '</div>' +
      badge +
      '</div>';
  }).join('');
}

// ═══════════════════════════════════════════════════════════
// PAGE 2: MODULE
// ═══════════════════════════════════════════════════════════
function openModule(moduleId) {
  state.currentModuleId = moduleId;
  state.backStack = [goHome];

  var def = MODULE_DEFS.find(function(m) { return m.id === moduleId; });
  var cards = getCardsForModule(moduleId);

  document.getElementById('home-page').style.display = 'none';
  document.getElementById('module-page').style.display = 'block';
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('game-page').classList.remove('active');

  document.getElementById('module-title').textContent = def.icon + ' ' + def.title;
  document.getElementById('module-sub').textContent = cards.length + ' card' + (cards.length > 1 ? 's' : '') + ' available';

  renderCardsInModule(cards);
  window.scrollTo(0, 0);
}

function renderCardsInModule(cards) {
  var grid = document.getElementById('cards-grid');
  if (cards.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">' +
      '<div class="empty-icon">📚</div>' +
      '<div class="empty-text">Is module mein abhi koi card nahi hai.<br>Data add karne par yahan dikhega.</div>' +
      '</div>';
    return;
  }
  grid.innerHTML = cards.map(function(c, i) {
    return '<div class="card" onclick="openCard(' + i + ')">' +
      '<div class="card-icon">' + (c.icon || '📖') + '</div>' +
      '<div class="card-title">' + c.title + '</div>' +
      '<div class="card-desc">' + c.desc + '</div>' +
      '</div>';
  }).join('');
}

// ═══════════════════════════════════════════════════════════
// OPEN CARD
// ═══════════════════════════════════════════════════════════
function openCard(idx) {
  var cards = getCardsForModule(state.currentModuleId);
  state.currentCardIdx = idx;
  state.currentCard = cards[idx];
  state.backStack = [
    function() { openModule(state.currentModuleId); },
    goHome
  ];
  var c = state.currentCard;

  document.getElementById('home-page').style.display = 'none';
  document.getElementById('module-page').style.display = 'none';
  document.getElementById('game-page').classList.remove('active');
  document.getElementById('detail-page').classList.add('active');
  document.getElementById('detail-title').textContent = (c.icon || '') + ' ' + c.title;
  document.getElementById('detail-sub').textContent = c.desc;

  var content = document.getElementById('detail-content');
  if (c.type === 'letters') content.innerHTML = renderLetters(c);
  else if (c.type === 'sounds') content.innerHTML = renderSoundsMenu(c);
  else if (c.type === 'verbs') content.innerHTML = renderVerbs(c);
  else if (c.type === 'beverbs') content.innerHTML = renderBeVerbs(c);
  else if (c.type === 'modernverbs') content.innerHTML = renderModernVerbs(c);
  else if (c.type === 'topics') content.innerHTML = renderTopicsList(c);
  else content.innerHTML = '<p style="text-align:center;color:#94a3b8">Coming soon...</p>';
  window.scrollTo(0, 0);
}

// ═══════════════════════════════════════════════════════════
// TOPICS (Generic — Module 2, 3, 4, 5 sab ke liye)
// ═══════════════════════════════════════════════════════════
function renderTopicsList(card) {
  if (!card.topics || card.topics.length === 0) {
    return '<p style="text-align:center;color:#94a3b8">No topics yet</p>';
  }
  return '<div style="text-align:center;margin-bottom:16px;color:#94a3b8;font-size:0.85rem">👇 Topic par click karo — lesson aur practice</div>' +
    card.topics.map(function(t, i) {
      var lessonsCount = t.lessons ? t.lessons.length : 0;
      var practiceCount = t.practice ? t.practice.length : 0;
      return '<div class="topic-item" onclick="openTopic(' + i + ')">' +
        '<div class="topic-icon">' + (t.icon || '📌') + '</div>' +
        '<div class="topic-info">' +
        '<div class="topic-title">' + t.title + '</div>' +
        '<div class="topic-intro">' + (t.intro || '') + '</div>' +
        '<div class="topic-count">📚 ' + lessonsCount + ' lessons · 🎮 ' + practiceCount + ' practice</div>' +
        '</div>' +
        '</div>';
    }).join('');
}

function openTopic(topicIdx) {
  state.currentTopicIdx = topicIdx;
  pushBack(function() { openCard(state.currentCardIdx); });
  var topic = state.currentCard.topics[topicIdx];
  document.getElementById('detail-title').textContent = (topic.icon || '📌') + ' ' + topic.title;
  document.getElementById('detail-sub').textContent = topic.intro || '';
  document.getElementById('detail-content').innerHTML = renderTopicDetail(topic, topicIdx);
  window.scrollTo(0, 0);
}

function renderTopicDetail(topic, topicIdx) {
  var html = '';

  // Lessons
  if (topic.lessons && topic.lessons.length) {
    topic.lessons.forEach(function(lesson) {
      html += '<div class="lesson-card">' +
        '<div class="lesson-title">' + lesson.title + '</div>' +
        '<div class="lesson-content">' + (lesson.content || '') + '</div>';

      if (lesson.examples && lesson.examples.length) {
        lesson.examples.forEach(function(ex) {
          // Type 1: sentence + hi (Module 2 modals style)
          if (ex.sentence) {
            html += '<div class="lesson-example">' +
              '<div class="en">' + ex.sentence + '</div>' +
              '<div class="hi">' + (ex.hi || '') + '</div>' +
              '</div>';
          }
          // Type 2: word1 + word2 (Synonyms/Antonyms style)
          else if (ex.word1 && ex.word2) {
            html += '<div class="lesson-example">' +
              '<div class="pair">' +
              '<span class="w1">' + ex.word1 + '</span>' +
              '<span class="arrow">→</span>' +
              '<span class="w2">' + ex.word2 + '</span>' +
              '</div>' +
              '</div>';
          }
          // Type 3: active + passive (Voice style)
          else if (ex.active && ex.passive) {
            html += '<div class="lesson-example">' +
              '<div class="en">🟢 ' + ex.active + '</div>' +
              '<div class="hi">🔵 ' + ex.passive + '</div>' +
              '</div>';
          }
          // Fallback: raw JSON display
          else {
            html += '<div class="lesson-example">' +
              '<div class="en">' + JSON.stringify(ex) + '</div>' +
              '</div>';
          }
        });
      }
      html += '</div>';
    });
  }

  // Practice button
  var practiceCount = topic.practice ? topic.practice.length : 0;
  if (practiceCount > 0) {
    html += '<div class="practice-btn-wrap">' +
      '<button class="btn" onclick="startTopicPractice()" style="max-width:300px;margin:0 auto">' +
      '🎮 Practice ' + topic.title + ' (' + practiceCount + ' questions)</button>' +
      '</div>';
  } else {
    html += '<div style="text-align:center;color:#64748b;padding:20px">No practice questions yet</div>';
  }

  return html;
}

function startTopicPractice() {
  var topic = state.currentCard.topics[state.currentTopicIdx];
  if (!topic.practice || !topic.practice.length) {
    alert('No practice questions available');
    return;
  }
  var questions = topic.practice.map(function(p) {
    if (p.type === 'mcq') {
      return {
        emoji: '❓',
        label: 'MCQ',
        question: p.q,
        options: shuffle(p.options.slice()),
        answer: p.answer
      };
    }
    // Future: aur types add kar sakte hain
    return null;
  }).filter(function(q) { return q; });

  if (!questions.length) {
    alert('No MCQ questions found');
    return;
  }

  startGame(questions, '🎮 ' + topic.title, topic.title, function() {
    openTopic(state.currentTopicIdx);
  });
}

// ═══════════════════════════════════════════════════════════
// CARD: LETTERS
// ═══════════════════════════════════════════════════════════
function renderLetters(card) {
  if (!card.letters) return '<p style="text-align:center;color:#94a3b8">No letters</p>';
  return '<div style="text-align:center;margin-bottom:16px;color:#94a3b8;font-size:0.85rem">👇 Letter par click karo — sound aur practice</div>' +
    '<div class="letters-grid">' +
    card.letters.map(function(l, i) {
      var ex = l.examples ? l.examples.slice(0, 3).join(', ') : '';
      return '<div class="letter-card" onclick="startLetterGame(' + i + ')">' +
        '<div class="letter-big">' + l.capital + '</div>' +
        '<div class="letter-small">' + l.small + '</div>' +
        '<div class="letter-sound">' + l.sound + '</div>' +
        '<div class="letter-examples">' + ex + '</div>' +
        '</div>';
    }).join('') + '</div>' +
    '<div style="text-align:center;margin-top:20px;padding-bottom:40px">' +
    '<button class="btn" onclick="startLetterGame(0)" style="max-width:300px;margin:0 auto">🎮 Practice All Letters</button>' +
    '</div>';
}

function startLetterGame(letterIdx) {
  var letters = state.currentCard.letters;
  var l = letters[letterIdx];
  var ordered = [l].concat(letters.filter(function(x) { return x.capital !== l.capital; }));
  var questions = ordered.map(function(item) {
    var correct = item.sound;
    var others = letters.filter(function(x) { return x.sound !== correct; });
    return {
      emoji: '🔤',
      label: 'LETTER SOUND',
      question: '"' + item.capital + ' ' + item.small + '" ka sound kya hai?',
      hint: 'Examples: ' + (item.examples ? item.examples.join(', ') : ''),
      options: shuffle([correct].concat(others.slice(0, 3).map(function(x) { return x.sound; }))),
      answer: correct
    };
  });
  startGame(questions, '🔤 Letters Practice', 'A-Z Sounds', function() { openCard(state.currentCardIdx); });
}

function openSoundType(type) {

    document.getElementById('detail-title').textContent = '🔤 IPA Sound';
    document.getElementById('detail-sub').textContent = '20 Vowels + 24 Consonants';
    var sounds = card.sounds || [];
    document.getElementById('detail-content').innerHTML =
      '<div style="text-align:center;margin-bottom:16px;color:#94a3b8;font-size:0.85rem">👇 Category chuno — Vowel ya Consonant</div>' +
      sounds.map(function(cat, i) {
        return '<div class="sound-category" onclick="openIpaCategory(' + i + ')">' +
          '<div class="sound-cat-icon">' + (cat.icon || '🔊') + '</div>' +
          '<div class="sound-cat-info">' +
          '<div class="sound-cat-title">' + cat.title + '</div>' +
          '<div class="sound-cat-desc">' + (cat.items ? cat.items.length : 0) + ' sounds with 3 examples each</div>' +
          '</div>' +
          '</div>';
      }).join('');
  } else {
    document.getElementById('detail-title').textContent = '🇮🇳 Indian Vowel & Consonant';
    document.getElementById('detail-sub').textContent = '5 Vowels + 21 Consonants';
    var indianVowels = [
      { symbol: 'A', sound: 'ए', examples: ['Apple', 'Ant', 'Aeroplane'] },
      { symbol: 'E', sound: 'ई', examples: ['Egg', 'Ear', 'Eye'] },
      { symbol: 'I', sound: 'आइ', examples: ['Ice', 'Ink', 'Iron'] },
      { symbol: 'O', sound: 'ओ', examples: ['Orange', 'Ox', 'Owl'] },
      { symbol: 'U', sound: 'यू', examples: ['Umbrella', 'Uncle', 'Urn'] }
    ];
    var indianConsonants = [];
    var lettersSrc = card.letters || (state.currentCard.letters || []);
    'BCDFGHJKLMNPQRSTVWXYZ'.split('').forEach(function(ch) {
      var l = lettersSrc.find(function(x) { return x.capital === ch; });
      if (l) indianConsonants.push({ symbol: ch, sound: l.sound, examples: l.examples });
    });
    document.getElementById('detail-content').innerHTML =
      '<div style="text-align:center;margin-bottom:12px;color:#4ade80;font-weight:800;font-size:0.9rem">🅰️ Vowels</div>' +
      '<div class="letters-grid">' +
      indianVowels.map(function(item, i) {
        return '<div class="sound-item" onclick="startIndianGame(\'vowel\', ' + i + ')">' +
          '<div class="sound-symbol">' + item.symbol + '</div>' +
          '<div class="sound-desc">' + item.sound + '</div>' +
          '<div class="sound-example">' + item.examples.join(', ') + '</div>' +
          '</div>';
      }).join('') + '</div>' +
      '<div style="text-align:center;margin:20px 0 12px;color:#60a5fa;font-weight:800;font-size:0.9rem">🅱️ Consonants</div>' +
      '<div class="letters-grid">' +
      indianConsonants.map(function(item, i) {
        return '<div class="sound-item" onclick="startIndianGame(\'consonant\', ' + i + ')">' +
          '<div class="sound-symbol">' + item.symbol + '</div>' +
          '<div class="sound-desc">' + item.sound + '</div>' +
          '<div class="sound-example">' + item.examples.join(', ') + '</div>' +
          '</div>';
      }).join('') + '</div>';
  }
  window.scrollTo(0, 0);
}

function openIpaCategory(catIdx) {

function startIpaGame(catIdx, itemIdx) {
  var cat = state.currentCard.sounds[catIdx];
  var item = cat.items[itemIdx];
  var ordered = [item].concat(cat.items.filter(function(x) { return x.symbol !== item.symbol; }));
  var questions = ordered.map(function(it) {
    var correct = it.sound;
    var others = cat.items.filter(function(x) { return x.sound !== correct; });
    return {
      emoji: '🔊',
      label: cat.title.toUpperCase(),
      question: '"' + it.symbol + '" ka sound kya hai?',
      hint: 'Examples: ' + it.examples.join(', '),
      options: shuffle([correct].concat(others.slice(0, 3).map(function(x) { return x.sound; }))),
      answer: correct
    };
  });
  startGame(questions, '🔊 Sound Practice', cat.title, function() { openIpaCategory(catIdx); });
}

function startIndianGame(kind, idx) {
  var card = state.currentCard;
  var allItems = [];
  if (kind === 'vowel') {
    allItems = [
      { symbol: 'A', sound: 'ए', examples: ['Apple', 'Ant', 'Aeroplane'] },
      { symbol: 'E', sound: 'ई', examples: ['Egg', 'Ear', 'Eye'] },
      { symbol: 'I', sound: 'आइ', examples: ['Ice', 'Ink', 'Iron'] },
      { symbol: 'O', sound: 'ओ', examples: ['Orange', 'Ox', 'Owl'] },
      { symbol: 'U', sound: 'यू', examples: ['Umbrella', 'Uncle', 'Urn'] }
    ];
  } else {
    var lettersSrc = card.letters || [];
    'BCDFGHJKLMNPQRSTVWXYZ'.split('').forEach(function(ch) {
      var l = lettersSrc.find(function(x) { return x.capital === ch; });
      if (l) allItems.push({ symbol: ch, sound: l.sound, examples: l.examples });
    });
  }
  var item = allItems[idx];
  var ordered = [item].concat(allItems.filter(function(x) { return x.symbol !== item.symbol; }));
  var questions = ordered.map(function(it) {
    var correct = it.sound;
    var others = allItems.filter(function(x) { return x.sound !== correct; });
    return {
      emoji: kind === 'vowel' ? '🅰️' : '🅱️',
      label: (kind === 'vowel' ? 'VOWEL' : 'CONSONANT') + ' SOUND',
      question: '"' + it.symbol + '" ka sound kya hai?',
      hint: 'Examples: ' + it.examples.join(', '),
      options: shuffle([correct].concat(others.slice(0, 3).map(function(x) { return x.sound; }))),
      answer: correct
    };
  });
  startGame(questions, '🔊 Indian Sound Practice', kind === 'vowel' ? 'Vowels' : 'Consonants', function() { openSoundType('indian'); });
}

// ═══════════════════════════════════════════════════════════
// CARD: VERBS
// ═══════════════════════════════════════════════════════════
function renderVerbs(card) {
  if (!card.groups || card.groups.length === 0) return '<p style="text-align:center;color:#94a3b8">No verbs yet</p>';
  var html = '<div class="verb-letters">' +
    '<button class="verb-letter-btn all-btn active" onclick="showVerbs(\'all\')">ALL</button>' +
    card.groups.map(function(g) {
      return '<button class="verb-letter-btn" onclick="showVerbs(\'' + g.letter + '\')">' + g.letter + '</button>';
    }).join('') + '</div>' +
    '<div id="verbs-list"></div>' +
    '<div style="text-align:center;margin-top:20px;padding-bottom:40px">' +
    '<button class="btn" onclick="startVerbPractice()" style="max-width:300px;margin:0 auto">🎮 Practice Verbs</button>' +
    '</div>';
  setTimeout(function() { showVerbs('all'); }, 50);
  return html;
}

function showVerbs(letter) {
  state.currentVerbLetter = letter;
  document.querySelectorAll('.verb-letter-btn').forEach(function(b) {
    var isAll = b.textContent === 'ALL';
    var isActive = (letter === 'all' && isAll) || (b.textContent === letter && !isAll);
    b.classList.toggle('active', isActive);
  });
  var card = state.currentCard;
  var verbs = [];
  if (letter === 'all') {
    card.groups.forEach(function(g) { verbs = verbs.concat(g.verbs); });
  } else {
    var group = card.groups.find(function(g) { return g.letter === letter; });
    verbs = group ? group.verbs : [];
  }
  document.getElementById('verbs-list').innerHTML = verbs.map(function(v) {
    return '<div class="verb-row">' +
      '<div class="verb-row-v1">' + v.v1 + '</div>' +
      '<div class="verb-row-v2">' + v.v2 + '</div>' +
      '<div class="verb-row-v3">' + v.v3 + '</div>' +
      '<div class="verb-row-hi">' + v.hi + '</div>' +
      '</div>';
  }).join('');
}

function startVerbPractice() {
  var card = state.currentCard;
  var verbs = [];
  if (state.currentVerbLetter && state.currentVerbLetter !== 'all') {
    var g = card.groups.find(function(x) { return x.letter === state.currentVerbLetter; });
    verbs = g ? g.verbs : [];
  } else {
    card.groups.forEach(function(g) { verbs = verbs.concat(g.verbs); });
  }
  verbs = shuffle(verbs).slice(0, 10);
  var questions = [];
  verbs.forEach(function(v) {
    var othersV2 = verbs.filter(function(x) { return x.v2 !== v.v2; }).map(function(x) { return x.v2; });
    questions.push({
      emoji: '🔢',
      label: 'V2 (PAST)',
      question: '"' + v.v1 + '" ka V2 kya hai?',
      hint: 'V1: ' + v.v1,
      options: shuffle([v.v2].concat(othersV2.slice(0, 3))),
      answer: v.v2
    });
    var othersV3 = verbs.filter(function(x) { return x.v3 !== v.v3; }).map(function(x) { return x.v3; });
    questions.push({
      emoji: '🔢',
      label: 'V3 (PAST PARTICIPLE)',
      question: '"' + v.v1 + '" ka V3 kya hai?',
      hint: 'V1: ' + v.v1,
      options: shuffle([v.v3].concat(othersV3.slice(0, 3))),
      answer: v.v3
    });
  });
  startGame(questions, '🎮 Verb Practice', 'V2/V3', function() { openCard(state.currentCardIdx); });
}

    '</div>';
  document.getElementById('detail-content').innerHTML = html;
  window.scrollTo(0, 0);
}

function startModernVerbPractice() {
  var v = state.currentCard.verbs[state.currentModernVerbIdx];
  buildSentenceBuilderGame(v, function() { openModernVerbDetail(state.currentModernVerbIdx); });
}

// ═══════════════════════════════════════════════════════════
// SENTENCE BUILDER GAME
// ═══════════════════════════════════════════════════════════
function buildSentenceBuilderGame(verb, returnFn) {
  var allSimple = verb.examples.simple || [];
  var allNeg = verb.examples.negative || [];
  var allWh = verb.examples.wh || [];
  var hindiToEnglish = shuffle(allSimple.concat(allNeg)).slice(0, 5);
  var englishToHindi = shuffle(allSimple.concat(allWh)).slice(0, 5);

  var allWords = [];
  allSimple.concat(allNeg).concat(allWh).forEach(function(s) {
    if (s.words) s.words.forEach(function(w) {
      var clean = w.toLowerCase().trim();
      if (allWords.indexOf(clean) === -1) allWords.push(clean);
    });
  });

  var questions = [];
  hindiToEnglish.forEach(function(s) {
    var answer = s.words ? s.words.slice() : s.en.split(' ');
    var distractors = pickDistractors(allWords, answer, 2, 4);
    questions.push({
      mode: 'hindi-to-english',
      hindi: s.hi,
      english: s.en,
      words: shuffle(answer.concat(distractors)),
      answer: answer
    });
  });
  englishToHindi.forEach(function(s) {
    var answer = s.words ? s.words.slice() : s.en.split(' ');
    var distractors = pickDistractors(allWords, answer, 2, 4);
    questions.push({
      mode: 'english-to-hindi',
      english: s.en,
      hindi: s.hi,
      words: shuffle(answer.concat(distractors)),
      answer: answer
    });
  });

  state.sentenceBuilder = {
    questions: questions,
    idx: 0,
    correct: 0,
    wrong: 0,
    placed: [],
    usedIdx: [],
    returnFn: returnFn
  };

  document.getElementById('home-page').style.display = 'none';
  document.getElementById('module-page').style.display = 'none';
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('game-page').classList.add('active');
  renderSentenceBuilderQ();
  window.scrollTo(0, 0);
}

function pickDistractors(pool, answer, minCount, maxCount) {
  var lowerAnswer = answer.map(function(w) { return w.toLowerCase().trim(); });
  var available = pool.filter(function(w) { return lowerAnswer.indexOf(w.toLowerCase()) === -1; });
  var count = minCount + Math.floor(Math.random() * (maxCount - minCount + 1));
  var picked = [];
  var shuffled = shuffle(available);
  for (var i = 0; i < shuffled.length && picked.length < count; i++) {
    if (picked.indexOf(shuffled[i]) === -1) picked.push(shuffled[i]);
  }
  return picked;
}

function renderSentenceBuilderQ() {
  var sb = state.sentenceBuilder;
  var q = sb.questions[sb.idx];
  var total = sb.questions.length;
  document.getElementById('game-progress-fill').style.width = ((sb.idx + 1) / total * 100) + '%';

  var isHindi = q.mode === 'hindi-to-english';
  var label = isHindi ? '🇮🇳 Hindi → English' : '🇬🇧 English → Hindi';
  var promptText = isHindi ? q.hindi : q.english;
  var promptSub = isHindi ? 'Iska English banao' : 'Iska Hindi banao';

  sb.placed = [];
  sb.usedIdx = [];
  sb.wrongAttempts = 0;

  var html = '<div class="game-question">' +
    '<div class="game-label">' + label + '</div>' +
    '<div class="sentence-hindi">' + promptText + '</div>' +
    '<div class="game-question-hint">' + promptSub + '</div>' +
    '</div>' +
    '<div class="sentence-slots" id="sb-slots"></div>' +
    '<div class="word-bank" id="sb-bank"></div>' +
    '<div class="game-feedback" id="sb-feedback"></div>' +
    '<button class="game-next" id="sb-next" onclick="nextSentenceBuilder()">' +
    (sb.idx === total - 1 ? '🏁 Result' : '➡️ Next') + '</button>';

  document.getElementById('game-content').innerHTML = html;
  renderSBSlotsAndBank();
}

function renderSBSlotsAndBank() {
  var sb = state.sentenceBuilder;
  var q = sb.questions[sb.idx];
  var slotsEl = document.getElementById('sb-slots');
  var bankEl = document.getElementById('sb-bank');
  if (!slotsEl || !bankEl) return;

  var slotsHtml = '';
  for (var i = 0; i < q.answer.length; i++) {
    var val = sb.placed[i];
    var cls = 'sentence-slot' + (val ? ' filled' : '');
    slotsHtml += '<div class="' + cls + '" onclick="removeSBSlot(' + i + ')">' + (val || '?') + '</div>';
  }
  slotsEl.innerHTML = slotsHtml;

  bankEl.innerHTML = q.words.map(function(w, i) {
    var used = sb.usedIdx.indexOf(i) > -1;
    return '<div class="word-chip' + (used ? ' used' : '') + '" onclick="placeSBSlot(' + i + ')">' + w + '</div>';
  }).join('');

  var complete = sb.placed.length === q.answer.length && sb.placed.every(function(v) { return v; });
  var fb = document.getElementById('sb-feedback');
  var nextBtn = document.getElementById('sb-next');

  if (complete) {
    var isCorrect = sb.placed.every(function(v, i) { return v === q.answer[i]; });
    if (isCorrect) {
      fb.style.color = '#4ade80';
      fb.textContent = '✅ Correct!';
      nextBtn.classList.add('show');
      nextBtn.textContent = sb.idx === sb.questions.length - 1 ? '🏁 Result' : '➡️ Next';
    } else {
      fb.style.color = '#f87171';
      fb.textContent = '❌ Order galat hai — phir koshish karo';
      sb.wrongAttempts++;
      setTimeout(function() {
        sb.placed = [];
        sb.usedIdx = [];
        renderSBSlotsAndBank();
      }, 900);
    }
  } else {
    fb.textContent = sb.placed.filter(function(x) { return x; }).length + '/' + q.answer.length + ' words placed';
    fb.style.color = '#94a3b8';
    nextBtn.classList.remove('show');
  }
}

function placeSBSlot(wordIdx) {
  var sb = state.sentenceBuilder;
  var q = sb.questions[sb.idx];
  if (sb.usedIdx.indexOf(wordIdx) > -1) return;
  if (sb.placed.length >= q.answer.length) return;
  sb.placed.push(q.words[wordIdx]);
  sb.usedIdx.push(wordIdx);
  renderSBSlotsAndBank();
}

function removeSBSlot(slotIdx) {
  var sb = state.sentenceBuilder;
  if (slotIdx >= sb.placed.length) return;
  sb.placed.splice(slotIdx, 1);
  sb.usedIdx.splice(slotIdx, 1);
  renderSBSlotsAndBank();
}

function nextSentenceBuilder() {
  var sb = state.sentenceBuilder;
  var q = sb.questions[sb.idx];
  var isCorrect = sb.placed.every(function(v, i) { return v === q.answer[i]; });
  if (isCorrect) {
    sb.correct++;
    sb.idx++;
    if (sb.idx >= sb.questions.length) showSBResult();
    else renderSentenceBuilderQ();
  }
}

function showSBResult() {
  var sb = state.sentenceBuilder;
  var total = sb.questions.length;
  var pct = Math.round((sb.correct / total) * 100);
  var emoji = '🏆', title = 'Excellent!';
  if (pct < 40) { emoji = '🌱'; title = 'Keep Trying!'; }
  else if (pct < 70) { emoji = '👍'; title = 'Good Job!'; }
  else if (pct < 90) { emoji = '🔥'; title = 'Great!'; }
  else { emoji = '👑'; title = 'Legendary!'; }

  document.getElementById('game-content').innerHTML =
    '<div class="result-card">' +
    '<div class="result-emoji">' + emoji + '</div>' +
    '<div class="result-title">' + title + '</div>' +
    '<div class="result-stats">' +
    '<div class="result-stat"><div class="result-stat-value">' + sb.correct + '/' + total + '</div><div class="result-stat-label">Correct</div></div>' +
    '<div class="result-stat"><div class="result-stat-value">' + pct + '%</div><div class="result-stat-label">Accuracy</div></div>' +
    '</div>' +
    '<button class="btn" onclick="closeGame()">← Back</button>' +
    '</div>';
  document.getElementById('game-progress-fill').style.width = '100%';
}

// ═══════════════════════════════════════════════════════════
// MCQ GAME
// ═══════════════════════════════════════════════════════════
function startGame(questions, title, sub, returnFn) {
  if (!questions.length) { alert('No questions'); return; }
  state.gameQuestions = questions;
  state.gameIdx = 0;
  state.gameCorrect = 0;
  state.gameWrong = 0;
  state.gameReturnFn = returnFn;

  document.getElementById('home-page').style.display = 'none';
  document.getElementById('module-page').style.display = 'none';
  document.getElementById('detail-page').classList.remove('active');
  document.getElementById('game-page').classList.add('active');
  renderGameQ();
  window.scrollTo(0, 0);
}

function renderGameQ() {
  var q = state.gameQuestions[state.gameIdx];
  var total = state.gameQuestions.length;
  document.getElementById('game-progress-fill').style.width = ((state.gameIdx + 1) / total * 100) + '%';
  var html = '<div class="game-question">';
  if (q.emoji) html += '<div style="font-size:2.5rem;margin-bottom:10px">' + q.emoji + '</div>';
  if (q.label) html += '<div class="game-label">' + q.label + '</div>';
  html += '<div class="game-question-text">' + q.question + '</div>';
  if (q.hint) html += '<div class="game-question-hint">' + q.hint + '</div>';
  html += '</div><div class="game-options">';
  q.options.forEach(function(o, i) {
    html += '<div class="game-option" onclick="pickAnswer(' + i + ')">' +
      '<div class="game-option-letter">' + String.fromCharCode(65+i) + '</div>' +
      '<div>' + o + '</div></div>';
  });
  html += '</div><div class="game-feedback" id="game-feedback"></div>' +
    '<button class="game-next" id="game-next" onclick="nextQ()">' +
    (state.gameIdx === total - 1 ? '🏁 Result' : '➡️ Next') + '</button>';
  document.getElementById('game-content').innerHTML = html;
}

function pickAnswer(idx) {
  var q = state.gameQuestions[state.gameIdx];
  var opts = document.querySelectorAll('.game-option');
  opts.forEach(function(o) { o.style.pointerEvents = 'none'; });
  var fb = document.getElementById('game-feedback');
  if (q.options[idx] === q.answer) {
    opts[idx].classList.add('correct');
    fb.style.color = '#4ade80';
    fb.textContent = '✅ Correct!';
    state.gameCorrect++;
    document.getElementById('game-next').classList.add('show');
  } else {
    opts[idx].classList.add('wrong');
    fb.style.color = '#f87171';
    fb.textContent = '❌ Galat — phir koshish karo';
    setTimeout(function() {
      opts.forEach(function(o) {
        o.classList.remove('wrong', 'correct');
        o.style.pointerEvents = 'auto';
      });
      fb.textContent = '🔄 Phir se try karo';
      fb.style.color = '#60a5fa';
    }, 800);
  }
}

function nextQ() {
  state.gameIdx++;
  if (state.gameIdx >= state.gameQuestions.length) showResult();
  else renderGameQ();
}

function showResult() {
  var total = state.gameQuestions.length;
  var correct = state.gameCorrect;
  var pct = Math.round((correct / total) * 100);
  var emoji = '🏆', title = 'Excellent!';
  if (pct < 40) { emoji = '🌱'; title = 'Keep Trying!'; }
  else if (pct < 70) { emoji = '👍'; title = 'Good Job!'; }
  else if (pct < 90) { emoji = '🔥'; title = 'Great!'; }
  else { emoji = '👑'; title = 'Legendary!'; }
  document.getElementById('game-content').innerHTML =
    '<div class="result-card">' +
    '<div class="result-emoji">' + emoji + '</div>' +
    '<div class="result-title">' + title + '</div>' +
    '<div class="result-stats">' +
    '<div class="result-stat"><div class="result-stat-value">' + correct + '/' + total + '</div><div class="result-stat-label">Correct</div></div>' +
    '<div class="result-stat"><div class="result-stat-value">' + pct + '%</div><div class="result-stat-label">Accuracy</div></div>' +
    '</div>' +
    '<button class="btn" onclick="restartGame()">🔁 Try Again</button>' +
    '<button class="btn sec" onclick="closeGame()">← Back</button>' +
    '</div>';
  document.getElementById('game-progress-fill').style.width = '100%';
}

function restartGame() {
  state.gameIdx = 0;
  state.gameCorrect = 0;
  state.gameWrong = 0;
  renderGameQ();
  window.scrollTo(0, 0);
}

function closeGame() {
  document.getElementById('game-page').classList.remove('active');
  if (state.gameReturnFn) {
    var fn = state.gameReturnFn;
    state.gameReturnFn = null;
    fn();
  } else if (state.sentenceBuilder && state.sentenceBuilder.returnFn) {
    var fn2 = state.sentenceBuilder.returnFn;
    state.sentenceBuilder = null;
    fn2();
  } else {
    openCard(state.currentCardIdx);
  }
  window.scrollTo(0, 0);
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
